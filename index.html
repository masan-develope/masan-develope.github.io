    outline:none;font-family:var(--font);transition:border-color .2s;
    -webkit-appearance:none;appearance:none;
  }
  input:focus,textarea:focus,select:focus{border-color:#444;}
  input::placeholder,textarea::placeholder{color:#333;}
  button{cursor:pointer;font-family:var(--font);border:none;}
  .btn-w{background:var(--primary);color:var(--primary-text);border:none;border-radius:var(--radius);font-weight:800;padding:12px 24px;font-size:14px;transition:opacity .2s;}
  .btn-w:hover{opacity:.85;}
  .btn-g{background:var(--bg2);color:var(--text3);border:1px solid var(--border);border-radius:var(--radius);font-weight:600;padding:10px 18px;font-size:13px;transition:border-color .2s;}
  .btn-g:hover{border-color:#333;color:#888;}
  .btn-red{background:#1a0000;border:1px solid #330000;color:#ff4444;border-radius:8px;padding:6px 12px;font-size:11px;}
  .btn-green{background:#001a00;border:1px solid #003300;color:#44ff44;border-radius:8px;padding:6px 12px;font-size:11px;}
  .card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px;}

  .modal{background:var(--bg2);border:1px solid var(--border2);border-radius:18px;padding:28px;width:100%;max-width:440px;position:relative;}
  .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:9999;box-shadow:0 4px 32px rgba(0,0,0,.8);white-space:nowrap;pointer-events:none;animation:fadeIn .2s;}

  @keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .spinner{width:32px;height:32px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;}
  .tab-active{background:#111!important;color:#fff!important;}

// ════════════════════════════════════════
// STORAGE — JSONBin.io (persisten semua device)
// localStorage sebagai cache supaya cepat
// ════════════════════════════════════════
let _cache = {}; // in-memory cache
let _saveTimer = null; // debounce timer untuk batch save

function _localGet(k){try{return JSON.parse(localStorage.getItem('ma_'+k));}catch{return null;}}
function _localSet(k,v){try{localStorage.setItem('ma_'+k,JSON.stringify(v));}catch{}}
function _localGetBinId(){return localStorage.getItem('ma_binid')||null;}
function _localSetBinId(id){localStorage.setItem('ma_binid',id);}

const DB = {
  get(k){
    if(k==='session') return _localGet('session');
    return _cache[k] !== undefined ? _cache[k] : _localGet(k);
  },

  set(k,v){
    if(k==='session'){_localSet('session',v);return;}
    _cache[k]=v;
    _localSet(k,v);
    // Debounce: batch semua perubahan, push ke JSONBin 800ms setelah set terakhir
    clearTimeout(_saveTimer);
    _saveTimer = setTimeout(()=>DB._push(), 800);
  },

  // Push semua cache ke JSONBin
  async _push(){
    if(!_binId) return;
    const data={
      settings:_cache.settings||DEFAULT_DATA.settings,
      products:_cache.products||DEFAULT_DATA.products,
      users:_cache.users||[],
      orders:_cache.orders||[],
      appeals:_cache.appeals||[],
    };
    try{
      await fetch(`${JSONBIN_API}/b/${_binId}`,{
        method:'PUT',
        headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY},
        body:JSON.stringify(data),
      });
    }catch(e){console.warn('JSONBin push gagal:',e);}
  },

  // Init: load dari JSONBin (bin ID sudah hardcode, sama untuk semua device)
  async init(){
    try{
      const res = await fetch(`${JSONBIN_API}/b/${_binId}/latest`,{
        headers:{'X-Master-Key':JSONBIN_KEY,'X-Bin-Meta':false},
      });
      if(res.ok){
        const data = await res.json();
        // Merge dengan default supaya key baru tetap ada
        _cache.settings = {...DEFAULT_DATA.settings,...(data.settings||{})};
        _cache.products = data.products||DEFAULT_DATA.products;
        _cache.users    = data.users||[];
        _cache.orders   = data.orders||[];
        _cache.appeals  = data.appeals||[];
        Object.keys(_cache).forEach(k=>_localSet(k,_cache[k]));
        return;
      }
    }catch(e){console.warn('JSONBin load gagal, pakai cache lokal:',e);}

    // Fallback ke localStorage jika JSONBin gagal
    _cache.settings = _localGet('settings')||{...DEFAULT_DATA.settings};
    _cache.products = _localGet('products')||[...DEFAULT_DATA.products];
    _cache.users    = _localGet('users')||[];
    _cache.orders   = _localGet('orders')||[];
    _cache.appeals  = _localGet('appeals')||[];
  }
};

// Apply theme from settings
function applyTheme(){
  const s=DB.get('settings')||{};
  const root=document.documentElement;

  // Font
  const fontMap={
    'Inter':"'Inter',sans-serif",
    'Poppins':"'Poppins',sans-serif",
    'Space Grotesk':"'Space Grotesk',sans-serif",
    'Syne':"'Syne',sans-serif",
    'Geist Mono':"'Geist Mono',monospace",
  };
  root.style.setProperty('--font', fontMap[s.font]||"'Inter',sans-serif");

  // Theme
  const accent=s.accentColor||'#ffffff';
  const isDark=s.theme!=='light';
  if(s.theme==='light'){
    root.style.setProperty('--bg','#f5f5f5');
    root.style.setProperty('--bg2','#ffffff');
    root.style.setProperty('--bg3','#eeeeee');
    root.style.setProperty('--border','#e0e0e0');
    root.style.setProperty('--border2','#d0d0d0');
    root.style.setProperty('--text','#111111');
    root.style.setProperty('--text2','#555555');
    root.style.setProperty('--text3','#888888');
  } else if(s.theme==='midnight'){
    root.style.setProperty('--bg','#0d1117');
    root.style.setProperty('--bg2','#161b22');
    root.style.setProperty('--bg3','#1c2128');
    root.style.setProperty('--border','#21262d');
    root.style.setProperty('--border2','#30363d');
    root.style.setProperty('--text','#e6edf3');
    root.style.setProperty('--text2','#8b949e');
    root.style.setProperty('--text3','#484f58');
  } else if(s.theme==='green'){
    root.style.setProperty('--bg','#000');
    root.style.setProperty('--bg2','#0a0a0a');
    root.style.setProperty('--bg3','#0f1a0f');
    root.style.setProperty('--border','#0f2a0f');
    root.style.setProperty('--border2','#1a3a1a');
    root.style.setProperty('--text','#00ff41');
    root.style.setProperty('--text2','#00aa2a');
    root.style.setProperty('--text3','#005515');
  } else {
    // default dark
    root.style.setProperty('--bg','#000');
    root.style.setProperty('--bg2','#0a0a0a');
    root.style.setProperty('--bg3','#111');
    root.style.setProperty('--border','#1a1a1a');
    root.style.setProperty('--border2','#222');
    root.style.setProperty('--text','#fff');
    root.style.setProperty('--text2','#888');
    root.style.setProperty('--text3','#444');
  }

  // Accent color
  root.style.setProperty('--primary', accent);
  // Compute text color on accent
  function hexToRgb(hex){
    hex=hex.replace('#','');
    if(hex.length===3) hex=hex.split('').map(c=>c+c).join('');
    const n=parseInt(hex,16);
    return[(n>>16)&255,(n>>8)&255,n&255];
  }
  try{
    const [r,g,b]=hexToRgb(accent);
    const lum=(0.299*r+0.587*g+0.114*b)/255;
    root.style.setProperty('--primary-text', lum>0.5?'#000':'#fff');
  }catch(e){}

  // Border radius
  root.style.setProperty('--radius',(s.borderRadius||'10')+'px');

  // Custom CSS
  let cssEl=document.getElementById('custom-css');
  if(!cssEl){cssEl=document.createElement('style');cssEl.id='custom-css';document.head.appendChild(cssEl);}
  cssEl.textContent=s.customCSS||'';
}

// ════════════════════════════════════════
// RENDER HELPERS
// ════════════════════════════════════════
function h(tag,attrs={},children=[]){
  const el=document.createElement(tag);
  for(const[k,v] of Object.entries(attrs)){
    if(k==='style'&&typeof v==='object'){Object.assign(el.style,v);}
    else if(k.startsWith('on')&&typeof v==='function'){el.addEventListener(k.slice(2).toLowerCase(),v);}
    else if(k==='class'){el.className=v;}
    else if(k==='html'){el.innerHTML=v;}
    else{el.setAttribute(k,v);}
  }
  for(const c of children){
    if(c==null||c===false||c===undefined)continue;
    el.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return el;
}

function render(el){
  const app=document.getElementById('app');
  app.innerHTML='';
  app.appendChild(el);
}

// ════════════════════════════════════════
// INPUT SANITIZE HELPERS
// ════════════════════════════════════════
function sanitize(str){
  if(typeof str!=='string') str=String(str||'');
  return str
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#x27;')
    .replace(/\//g,'&#x2F;');
}
// Strip tags completely (for stored plain-text fields)
function strip(str){
  if(typeof str!=='string') str=String(str||'');
  return str.replace(/<[^>]*>/g,'').trim();
}
// Validate URL (only allow http/https)
function safeUrl(url){
  try{
    const u=new URL(url);
    return (u.protocol==='http:'||u.protocol==='https:') ? url : '#';
  }catch{return '#';}
}
// Safe text node setter — sets element's textContent (never innerHTML)
function safeText(el,str){el.textContent=strip(str);}

// ORDER MODAL
// ════════════════════════════════════════
function showOrderModal(product,user,onClose){
  let step=1,msgInp;
  let bg;

  function setStep(n){
    step=n;
    const body=document.getElementById('order-body');
    body.innerHTML='';
    if(n===1){
      body.appendChild(captchaWidget(()=>setStep(2)));
    } else if(n===2){
      msgInp=h('textarea',{placeholder:'Contoh: Saya ingin pesan sistem ini untuk game Roblox saya. Detail: ...',style:{minHeight:'120px',resize:'vertical',marginBottom:'16px'}});
      body.appendChild(h('p',{style:{color:'var(--text2)',fontSize:'13px',marginBottom:'10px'}},'Tulis pesan / detail ordermu:'));
      body.appendChild(msgInp);
      body.appendChild(h('p',{style:{color:'var(--text3)',fontSize:'11px',marginBottom:'16px'}},'Pesanan akan disimpan dan founder akan menghubungimu segera.'));
      body.appendChild(h('button',{class:'btn-w',style:{width:'100%',padding:'14px'},onClick(){
        const cleanMsg=strip(msgInp.value);
        if(!cleanMsg){showToast('Pesan tidak boleh kosong.','err');return;}
        if(cleanMsg.length>2000){showToast('Pesan terlalu panjang (maks 2000 karakter).','err');return;}
        const orders=DB.get('orders')||[];
        orders.push({id:uid(),productId:product.id,productName:strip(product.name),price:strip(product.price),userId:user.id,userEmail:strip(user.email),userName:strip(user.name),message:cleanMsg,createdAt:now(),status:'pending'});
        DB.set('orders',orders);setStep(3);
      }},'Kirim Order'));
    } else {
      body.appendChild(h('div',{style:{textAlign:'center',padding:'20px 0'}},[
        h('div',{style:{fontSize:'48px',marginBottom:'16px'}},'✅'),
        h('h4',{style:{fontWeight:800,fontSize:'18px',marginBottom:'8px'}},'Order Terkirim!'),
        h('p',{style:{color:'var(--text2)',fontSize:'13px',marginBottom:'20px'}},`Founder akan menghubungi via email ${strip(user.email)} secepatnya.`),
        h('button',{class:'btn-w',style:{padding:'12px 32px'},onClick:onClose},'Tutup'),
      ]));
    }
  }

  bg=h('div',{class:'modal-bg',onClick(e){if(e.target===bg)onClose();}},[
    h('div',{class:'modal'},[
      h('button',{style:{position:'absolute',top:'16px',right:'16px',background:'none',border:'none',color:'var(--text3)',fontSize:'20px'},onClick:onClose},'✕'),
      h('h3',{style:{fontWeight:800,fontSize:'18px',marginBottom:'4px'}},'Order Produk'),
      h('p',{style:{color:'var(--text3)',fontSize:'13px',marginBottom:'20px'}},product.name+' — '+product.price),
      h('div',{id:'order-body'}),
    ]),
  ]);
  document.body.appendChild(bg);
  setStep(1);
  return ()=>{if(bg.parentNode)bg.parentNode.removeChild(bg);};
}

    const wrap=h('div',{},[
      h('h2',{style:{fontSize:'26px',fontWeight:800,marginBottom:'24px',letterSpacing:'-1px'}},'Akun Saya'),
      h('div',{class:'card',style:{marginBottom:'14px'}},[

      const f=document.getElementById('acct-fields');

    h('div',{style:{position:'fixed',bottom:0,left:0,right:0,background:'rgba(0,0,0,.95)',backdropFilter:'blur(12px)',borderTop:'1px solid var(--border)',display:'flex',justifyContent:'space-around',padding:'8px 0 12px'}},

function renderFounder(){
  let tab='dashboard';
  let settings=DB.get('settings')||{};
  let products=DB.get('products')||[];
  let users=DB.get('users')||[];
  let orders=DB.get('orders')||[];
  let appeals=DB.get('appeals')||[];
  let editProduct=null;

  const tabs=[
    {id:'dashboard',icon:'📊',label:'Dashboard'},
    {id:'products',icon:'📦',label:'Produk'},
    {id:'users',icon:'👥',label:'Users'},
    {id:'orders',icon:'📋',label:'Orders'},
    {id:'appeals',icon:'⚖️',label:'Banding'},
    {id:'settings',icon:'⚙️',label:'Pengaturan'},
    {id:'appearance',icon:'🎨',label:'Tampilan'},
    {id:'sitetools',icon:'🛠️',label:'Site Tools'},
  ];

  function refresh(){
    products=DB.get('products')||[];
    users=DB.get('users')||[];
    orders=DB.get('orders')||[];
    appeals=DB.get('appeals')||[];
    settings=DB.get('settings')||{};
  }

  function setTab(t){
    tab=t;refresh();
    const main=document.getElementById('f-main');
    if(!main)return;
    main.innerHTML='';
    main.appendChild(buildContent());
    tabs.forEach(tb=>{
      const btn=document.getElementById('ftab-'+tb.id);
      if(btn){btn.className=tb.id===t?'tab-active':'';btn.style.color=tb.id===t?'#fff':'#444';}
    });
  }

  function buildContent(){
    if(tab==='dashboard') return buildDash();
    if(tab==='products') return buildProducts();
    if(tab==='users') return buildUsers();
    if(tab==='orders') return buildOrders();
    if(tab==='appeals') return buildAppeals();
    if(tab==='settings') return buildSettings();
    if(tab==='appearance') return buildAppearance();
    if(tab==='sitetools') return buildSiteTools();
    return h('div',{},'');
  }

  function buildDash(){
    const revenue=orders.reduce((a,o)=>{
      const n=parseInt((o.price||'').replace(/\D/g,''))||0;
      return a+n;
    },0);
    const pendingOrders=orders.filter(o=>o.status==='pending').length;
    return h('div',{},[

          {label:'Total Produk',val:products.length,icon:'📦'},
          {label:'Total Order',val:orders.length,icon:'📋'},
          {label:'Banding Pending',val:appeals.filter(a=>a.status==='pending').length,icon:'⚖️'},
          {label:'Order Pending',val:pendingOrders,icon:'⏳'},
          {label:'Est. Revenue',val:'Rp '+revenue.toLocaleString('id-ID'),icon:'💰'},
        ].map(s=>
          h('div',{class:'card'},[
            h('div',{style:{fontSize:'20px',marginBottom:'8px'}},s.icon),
            h('div',{style:{color:'#444',fontSize:'11px',marginBottom:'4px'}},s.label),
            h('div',{style:{fontSize:'22px',fontWeight:900,wordBreak:'break-all'}},String(s.val)),
          ])
        )
      ),
      h('div',{class:'card',style:{marginBottom:'16px',border:'1px solid #1a2a1a'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'8px',color:'#44ff44'}},'🔗 Share / Publish Situs'),
        h('p',{style:{color:'#555',fontSize:'12px',marginBottom:'12px',lineHeight:1.6}},'Bagikan link ini ke siapapun — mereka bisa langsung buka situsmu tanpa install apapun. Link bisa dibuka di Chrome, Firefox, HP, PC, dll.'),

  function buildProducts(){
    function prodForm(){
      const isEdit=!!(editProduct&&editProduct.id);
      const fields={};
      const fieldDefs=[{key:'name',label:'Nama Produk'},{key:'category',label:'Kategori'},{key:'price',label:'Harga'},{key:'desc',label:'Deskripsi singkat'},{key:'detail',label:'Detail lengkap'},{key:'thumb',label:'URL Thumbnail (image)'}];
      const formEl=h('div',{style:{background:'#0a0a0a',border:'1px solid #333',borderRadius:'16px',padding:'24px',marginBottom:'20px'}},[
        h('h4',{style:{marginBottom:'16px',fontWeight:700}},isEdit?'Edit Produk':'Tambah Produk'),
        ...fieldDefs.map(f=>{
          let inp;
          if(f.key==='desc'||f.key==='detail'){
            inp=h('textarea',{style:{minHeight:'70px',resize:'vertical'}});
          } else {
            inp=h('input',{type:'text'});
          }
          inp.value=(editProduct&&editProduct[f.key])||'';
          fields[f.key]=inp;
          return h('div',{class:'form-row'},[h('label',{class:'lbl'},f.label),inp]);
        }),
        h('div',{class:'form-row'},[
          h('label',{class:'lbl'},'Upload Thumbnail (PNG/JPG)'),
          h('input',{type:'file',accept:'image/*',style:{background:'none',border:'none',color:'#555',padding:0},onChange(e){
            const file=e.target.files[0];if(!file)return;
            const reader=new FileReader();
            reader.onload=ev=>{fields.thumb.value=ev.target.result;};
            reader.readAsDataURL(file);
          }}),
        ]),
        h('div',{style:{display:'flex',gap:'10px',marginTop:'16px'}},[
          h('button',{class:'btn-g',style:{flex:1,padding:'11px'},onClick(){editProduct=null;setTab('products');}},'Batal'),
          h('button',{class:'btn-w',style:{flex:1,padding:'11px'},onClick(){
            const p={};
            fieldDefs.forEach(f=>{p[f.key]=strip(fields[f.key].value);});
            // thumb is URL or base64 — only sanitize if it's a URL
            if(fields.thumb&&fields.thumb.value&&!fields.thumb.value.startsWith('data:')){
              p.thumb=safeUrl(fields.thumb.value);
            } else if(fields.thumb){
              p.thumb=fields.thumb.value; // base64 data URL from file picker
            }
            if(!p.name){showToast('Nama produk wajib diisi.','err');return;}
            if(isEdit)p.id=editProduct.id;
            let prods=DB.get('products')||[];
            if(p.id&&prods.find(x=>x.id===p.id)) prods=prods.map(x=>x.id===p.id?p:x);
            else prods=[...prods,{...p,id:uid()}];
            DB.set('products',prods);editProduct=null;showToast('Produk disimpan!');setTab('products');
          }},'Simpan'),
        ]),
      ]);
      return formEl;
    }

    const prods=DB.get('products')||[];
    return h('div',{},[
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}},[
        h('h2',{style:{fontSize:'24px',fontWeight:800}},'Produk'),
        h('button',{class:'btn-w',style:{padding:'10px 20px',fontSize:'13px'},onClick(){editProduct={id:'',name:'',price:'',desc:'',detail:'',thumb:'',category:''};setTab('products');}},'+ Tambah'),
      ]),
      editProduct ? prodForm() : h('span',{},''),
      h('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}},
        prods.map(p=>h('div',{style:{background:'#0a0a0a',border:'1px solid #1a1a1a',borderRadius:'14px',padding:'18px',display:'flex',gap:'14px',alignItems:'center'}},[
          h('div',{style:{width:'54px',height:'54px',background:'#111',borderRadius:'10px',flexShrink:0,display:'flex',alignItems:'center',justifyContent:'center',overflow:'hidden'}},
            p.thumb ? [h('img',{src:p.thumb,alt:'',style:{width:'100%',height:'100%',objectFit:'cover'}})] : [h('span',{style:{fontSize:'24px'}},'📦')]
          ),
          h('div',{style:{flex:1}},[
            h('div',{style:{fontWeight:700,fontSize:'14px'}},p.name),
            h('div',{style:{color:'#444',fontSize:'12px'}},p.category+' · '+p.price),
          ]),
          h('div',{style:{display:'flex',gap:'8px'}},[
            h('button',{class:'btn-g',style:{padding:'7px 14px',fontSize:'12px'},onClick(){editProduct=p;setTab('products');}},'Edit'),
            h('button',{class:'btn-red',onClick(){
              const ps=(DB.get('products')||[]).filter(x=>x.id!==p.id);
              DB.set('products',ps);showToast('Produk dihapus');setTab('products');
            }},'Hapus'),
          ]),
        ]))
      ),
    ]);
  }

          h('div',{style:{width:'40px',height:'40px',borderRadius:'50%',background:'#111',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:900,fontSize:'16px',flexShrink:0}},u.name?.[0]||'?'),

            }},'Tolak'),

              if(ui!==-1){us[ui].blocked=false;DB.set('users',us);}

  function buildSettings(){
    let cfg={...settings,socialLinks:[...(settings.socialLinks||[]).map(s=>({...s}))]};
    const logoPrev=h('div',{id:'logo-prev',style:{marginBottom:'12px'}});

    function buildLogoPreview(){
      logoPrev.innerHTML='';
      if(cfg.logo){
        logoPrev.appendChild(h('img',{src:cfg.logo,alt:'logo',style:{width:'72px',height:'72px',borderRadius:'50%',objectFit:'cover',border:'2px solid #333',display:'block'}}));
      } else {
        const d=document.createElement('div');
        Object.assign(d.style,{width:'72px',height:'72px',borderRadius:'50%',background:'#111',border:'2px solid #222',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'28px',fontWeight:900});
        d.textContent=cfg.siteName?.[0]||'M';
        logoPrev.appendChild(d);
      }
    }

    const fields=[
      {key:'siteName',label:'Nama Situs'},
      {key:'tagline',label:'Tagline'},
      {key:'founderEmail',label:'Email Founder (login)'},
      {key:'founderPass',label:'Password Founder',type:'password'},
      {key:'supportEmail',label:'Email Support'},
      {key:'copyright',label:'Teks Copyright'},
    ];
    const inputs={};

    const socialWrap=h('div',{id:'social-wrap'});
    function buildSocLinks(){
      socialWrap.innerHTML='';
      (cfg.socialLinks||[]).forEach((s,i)=>{
        const iconInp=h('input',{type:'text',style:{width:'50px',textAlign:'center'}});iconInp.value=s.icon;
        const lblInp=h('input',{type:'text',placeholder:'Label'});lblInp.value=s.label;
        const urlInp=h('input',{type:'text',placeholder:'URL'});urlInp.value=s.url;
        iconInp.addEventListener('input',e=>{cfg.socialLinks[i].icon=e.target.value;});
        lblInp.addEventListener('input',e=>{cfg.socialLinks[i].label=e.target.value;});
        urlInp.addEventListener('input',e=>{cfg.socialLinks[i].url=e.target.value;});
        socialWrap.appendChild(h('div',{style:{display:'flex',gap:'8px',marginBottom:'8px',alignItems:'center'}},[
          iconInp,lblInp,urlInp,
          h('button',{style:{background:'none',border:'none',color:'#ff4444',fontSize:'18px',flexShrink:0},onClick(){cfg.socialLinks.splice(i,1);buildSocLinks();}},'✕'),
        ]));
      });
    }

    const wrap=h('div',{},[
      h('h2',{style:{fontSize:'24px',fontWeight:800,marginBottom:'20px'}},'Pengaturan Situs'),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Logo'),
        logoPrev,
        h('label',{class:'lbl'},'Upload Logo'),
        h('input',{type:'file',accept:'image/*',style:{background:'none',border:'none',color:'#555',padding:'4px 0',marginBottom:'8px'},onChange(e){
          const file=e.target.files[0];if(!file)return;
          const reader=new FileReader();
          reader.onload=ev=>{cfg.logo=ev.target.result;buildLogoPreview();};
          reader.readAsDataURL(file);
        }}),
        h('label',{class:'lbl',style:{marginTop:'4px'}},'Atau URL Logo'),
        (()=>{
          const inp=h('input',{type:'text',placeholder:'https://...'});
          inp.value=cfg.logo&&!cfg.logo.startsWith('data:')?cfg.logo:'';
          inp.addEventListener('input',e=>{cfg.logo=e.target.value;buildLogoPreview();});
          return inp;
        })(),
        h('button',{class:'btn-red',style:{marginTop:'10px',fontSize:'11px'},onClick(){cfg.logo='';buildLogoPreview();}},'Hapus Logo'),
      ]),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Informasi Situs'),
        ...fields.map(f=>{
          const inp=h('input',{type:f.type||'text'});
          inp.value=cfg[f.key]||'';
          inp.addEventListener('input',e=>{cfg[f.key]=e.target.value;});
          inputs[f.key]=inp;
          return h('div',{class:'form-row'},[h('label',{class:'lbl'},f.label),inp]);
        }),
      ]),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}},[
          h('h4',{style:{fontWeight:700,color:'#888'}},'Sosial Media'),
          h('button',{class:'btn-g',style:{padding:'6px 14px',fontSize:'12px'},onClick(){
            if(!cfg.socialLinks)cfg.socialLinks=[];
            cfg.socialLinks.push({label:'',url:'',icon:'🔗'});buildSocLinks();
          }},'+ Tambah'),
        ]),
        socialWrap,
      ]),

      h('button',{class:'btn-w',style:{padding:'13px 32px',fontSize:'14px'},onClick(){
        // Sanitize all text fields before save
        ['siteName','tagline','supportEmail','copyright','founderEmail'].forEach(k=>{if(cfg[k])cfg[k]=strip(cfg[k]);});
        if(cfg.socialLinks) cfg.socialLinks=cfg.socialLinks.map(sl=>({icon:strip(sl.icon).slice(0,4),label:strip(sl.label),url:safeUrl(sl.url)}));
        DB.set('settings',cfg);settings=cfg;applyTheme();showToast('Pengaturan disimpan!');
      }},'Simpan Semua Pengaturan'),
    ]);

    buildLogoPreview();buildSocLinks();
    return wrap;
  }

  // ════════ APPEARANCE TAB ════════
  function buildAppearance(){
    let cfg={...settings};

    const fontOptions=['Inter','Poppins','Space Grotesk','Syne','Geist Mono'];
    const themeOptions=[
      {val:'dark',label:'🌑 Dark (Default)'},

    accentInp.addEventListener('input',e=>{cfg.accentColor=e.target.value;});

        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Font'),

        h('div',{style:{display:'flex',flexWrap:'wrap',gap:'8px',marginTop:'8px'}},
          fontOptions.map(f=>h('div',{style:{padding:'6px 14px',background:'#111',border:'1px solid #222',borderRadius:'8px',fontSize:'12px',fontFamily:"'"+f+"',sans-serif"}},f))
        ),
      ]),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Tema Warna'),
        h('div',{class:'form-row'},[h('label',{class:'lbl'},'Pilih Tema'),themeSel]),
        h('div',{class:'form-row'},[
          h('label',{class:'lbl'},'Warna Aksen (Tombol, Highlight)'),
          h('div',{style:{display:'flex',gap:'10px',alignItems:'center'}},[accentInp,accentText]),
          h('p',{style:{color:'#333',fontSize:'11px',marginTop:'6px'}},'Warna ini dipakai di tombol utama, nav active, dll.'),
        ]),
        h('div',{style:{display:'flex',gap:'8px',marginTop:'8px',flexWrap:'wrap'}},
          ['#ffffff','#ff6b6b','#4ecdc4','#ffe66d','#a8e6cf','#ff8b94','#c3a6ff','#f7b733'].map(c=>{

            b.title=c;
            b.addEventListener('click',()=>{cfg.accentColor=c;accentInp.value=c;accentText.value=c;});

          })
        ),
      ]),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Border Radius'),
        h('p',{style:{color:'#444',fontSize:'12px',marginBottom:'8px'}},'Ubah radius sudut elemen (tombol, card, input)'),

        radiusLabel,
        h('div',{style:{display:'flex',gap:'8px',marginTop:'12px'}},
          [0,6,10,16,24].map(r=>{
            const b=document.createElement('button');
            b.textContent=r+'px';
            b.style.cssText='padding:6px 12px;background:#111;border:1px solid #222;color:#888;border-radius:8px;font-size:11px;cursor:pointer;';
            b.addEventListener('click',()=>{cfg.borderRadius=String(r);radiusInp.value=r;radiusLabel.textContent=r+'px';});
            return b;
          })
        ),
      ]),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'12px',color:'#888'}},'Custom CSS'),
        h('p',{style:{color:'#444',fontSize:'12px',marginBottom:'10px'}},'Tulis CSS tambahan yang akan langsung diapply ke situs'),
        cssArea,
      ]),

      h('div',{style:{display:'flex',gap:'10px'}},[
        h('button',{class:'btn-w',style:{padding:'13px 32px',fontSize:'14px'},onClick(){
          Object.assign(cfg,{font:fontSel.value,theme:themeSel.value,accentColor:accentInp.value,borderRadius:radiusInp.value,customCSS:cssArea.value});
          const full={...DB.get('settings')||{},...cfg};
          DB.set('settings',full);settings=full;applyTheme();showToast('Tampilan disimpan!');
        }},'Simpan & Preview'),
        h('button',{class:'btn-g',style:{padding:'13px 24px',fontSize:'14px'},onClick(){
          if(!confirm('Reset tampilan ke default?'))return;
          const full={...DB.get('settings')||{},font:'Inter',theme:'dark',accentColor:'#ffffff',borderRadius:'10',customCSS:''};
          DB.set('settings',full);settings=full;applyTheme();showToast('Reset ke default');setTab('appearance');
        }},'Reset Default'),
      ]),
    ]);
  }

  // ════════ SITE TOOLS TAB ════════
  function buildSiteTools(){
    let cfg={...settings};

    const maintToggle=document.createElement('input');
    maintToggle.type='checkbox';
    maintToggle.checked=!!cfg.maintenanceMode;
    maintToggle.style.cssText='width:auto;transform:scale(1.4);cursor:pointer;margin-right:8px;';

    const maintMsg=document.createElement('input');
    maintMsg.type='text';
    maintMsg.value=cfg.maintenanceMsg||'Sedang dalam maintenance. Silakan coba lagi nanti.';

    const annToggle=document.createElement('input');
    annToggle.type='checkbox';
    annToggle.checked=!!cfg.announcementBarOn;
    annToggle.style.cssText='width:auto;transform:scale(1.4);cursor:pointer;margin-right:8px;';

    const annMsg=document.createElement('input');
    annMsg.type='text';
    annMsg.placeholder='Contoh: 🎉 Promo akhir tahun! Diskon 20% semua produk';
    annMsg.value=cfg.announcementBar||'';

    // Backup/restore
    function exportData(){
      const data={users:DB.get('users'),products:DB.get('products'),orders:DB.get('orders'),appeals:DB.get('appeals'),settings:DB.get('settings')};
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='masandev-backup-'+Date.now()+'.json';a.click();
      URL.revokeObjectURL(url);
      showToast('Backup didownload!');
    }

    function importData(){
      const inp=document.createElement('input');
      inp.type='file';inp.accept='.json';
      inp.addEventListener('change',e=>{
        const file=e.target.files[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=ev=>{
          try{
            const data=JSON.parse(ev.target.result);
            if(data.users)DB.set('users',data.users);
            if(data.products)DB.set('products',data.products);
            if(data.orders)DB.set('orders',data.orders);
            if(data.appeals)DB.set('appeals',data.appeals);
            if(data.settings)DB.set('settings',data.settings);
            showToast('Data berhasil di-import!');applyTheme();setTab('sitetools');
          }catch(err){showToast('File tidak valid!','err');}
        };
        reader.readAsText(file);
      });
      inp.click();
    }

    return h('div',{},[
      h('h2',{style:{fontSize:'24px',fontWeight:800,marginBottom:'6px'}},'Site Tools'),
      h('p',{style:{color:'#444',fontSize:'13px',marginBottom:'24px'}},'Tools manajemen lanjutan'),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Maintenance Mode'),
        h('div',{style:{display:'flex',alignItems:'center',marginBottom:'12px'}},[
          maintToggle,
          h('span',{style:{fontSize:'14px',fontWeight:600}},'Aktifkan Maintenance Mode'),
        ]),
        h('p',{style:{color:'#444',fontSize:'12px',marginBottom:'10px'}},'Saat aktif, user biasa tidak bisa akses. Hanya founder yang bisa login.'),
        h('div',{class:'form-row'},[h('label',{class:'lbl'},'Pesan Maintenance'),maintMsg]),
      ]),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Announcement Bar'),
        h('div',{style:{display:'flex',alignItems:'center',marginBottom:'12px'}},[
          annToggle,
          h('span',{style:{fontSize:'14px',fontWeight:600}},'Tampilkan Announcement Bar'),
        ]),
        h('p',{style:{color:'#444',fontSize:'12px',marginBottom:'10px'}},'Bar notifikasi di bagian atas halaman beranda user.'),
        h('div',{class:'form-row'},[h('label',{class:'lbl'},'Pesan Announcement'),annMsg]),
      ]),

      h('button',{class:'btn-w',style:{padding:'12px 28px',fontSize:'14px',marginBottom:'24px'},onClick(){
        const full={...DB.get('settings')||{},
          maintenanceMode:maintToggle.checked,
          maintenanceMsg:strip(maintMsg.value).slice(0,300),
          announcementBarOn:annToggle.checked,
          announcementBar:strip(annMsg.value).slice(0,200),
        };
        DB.set('settings',full);settings=full;applyTheme();showToast('Site tools disimpan!');
      }},'Simpan Site Tools'),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Backup & Restore'),
        h('p',{style:{color:'#444',fontSize:'12px',marginBottom:'16px'}},'Export semua data (users, produk, orders, settings) ke file JSON, atau restore dari backup.'),
        h('div',{style:{display:'flex',gap:'10px',flexWrap:'wrap'}},[
          h('button',{class:'btn-w',style:{padding:'10px 22px',fontSize:'13px'},onClick:exportData},'⬇️ Export Backup'),
          h('button',{class:'btn-g',style:{padding:'10px 22px',fontSize:'13px'},onClick:importData},'⬆️ Import Backup'),
        ]),
      ]),

      h('div',{class:'card',style:{border:'1px solid #330000'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'12px',color:'#ff4444'}},'⚠️ Danger Zone'),
        h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}},[
          h('button',{class:'btn-red',style:{textAlign:'left',padding:'10px 16px'},onClick(){
            if(!confirm('Hapus semua order? Tidak bisa dibatalkan.'))return;
            DB.set('orders',[]);showToast('Semua order dihapus');setTab('sitetools');
          }},'Hapus Semua Order'),
          h('button',{class:'btn-red',style:{textAlign:'left',padding:'10px 16px'},onClick(){
            if(!confirm('Reset semua user? TIDAK bisa dibatalkan!'))return;
            DB.set('users',[]);DB.set('session',DB.get('session'));showToast('Semua user dihapus');setTab('sitetools');
          }},'Hapus Semua User'),
          h('button',{style:{background:'#1a0000',border:'1px solid #660000',color:'#ff2222',borderRadius:'8px',padding:'10px 16px',fontSize:'12px',textAlign:'left'},onClick(){
            if(!confirm('RESET TOTAL? Semua data terhapus kecuali founder login!'))return;
            if(!confirm('Yakin 100%? Ini TIDAK bisa dibatalkan!'))return;
            const s2=DB.get('settings')||{};
            const fe=s2.founderEmail;const fp=s2.founderPass;
            localStorage.clear();
            DB.init();
            const ns=DB.get('settings')||{};ns.founderEmail=fe;ns.founderPass=fp;DB.set('settings',ns);
            DB.set('session',{email:fe,name:'Founder',role:'founder',id:'founder'});
            showToast('Factory reset selesai');renderFounder();
          }},'🔥 Factory Reset (Hapus Semua Data)'),
        ]),
      ]),
    ]);
  }

  // ════════ LAYOUT ════════
  const sidebar=h('div',{style:{width:'200px',background:'#050505',borderRight:'1px solid #111',display:'flex',flexDirection:'column',position:'fixed',top:0,left:0,bottom:0,zIndex:50}},[
    h('div',{style:{padding:'20px 16px',borderBottom:'1px solid #111'}},[
      h('div',{style:{fontWeight:900,fontSize:'13px',color:'#fff'}},'MA Founder'),
      h('div',{style:{fontSize:'10px',color:'#333',marginTop:'2px'}},'Panel Admin'),
    ]),
    h('div',{style:{flex:1,padding:'10px',overflowY:'auto'}},
      tabs.map(t=>h('button',{id:'ftab-'+t.id,style:{width:'100%',background:'none',border:'none',color:'#444',padding:'10px 12px',borderRadius:'8px',cursor:'pointer',textAlign:'left',display:'flex',gap:'10px',alignItems:'center',fontSize:'13px',marginBottom:'2px'},onClick(){setTab(t.id);}},[h('span',{},t.icon),t.label]))
    ),
    h('button',{style:{margin:'10px',background:'none',border:'1px solid #1a1a1a',color:'#333',padding:'10px',borderRadius:'8px',fontSize:'12px'},onClick(){DB.set('session',null);renderAuth();}},'Logout'),
  ]);

  const screen=h('div',{style:{minHeight:'100vh',background:'#000',color:'#fff',display:'flex'}},[
    sidebar,
    h('div',{id:'f-main',style:{marginLeft:'200px',flex:1,padding:'28px',maxWidth:'calc(100vw - 200px)',minHeight:'100vh'}}),
  ]);

  render(screen);
  setTab('dashboard');
}

// ════════════════════════════════════════
// BOOT — async karena Firebase perlu load
// ════════════════════════════════════════
(async function boot(){
  // Tampilkan loading
  document.getElementById('app').innerHTML='<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;"><div class="spinner"></div><p style="color:#333;font-size:12px;">Menghubungkan ke server...</p></div>';

  try{
    await DB.init();
  } catch(e){
    // Jika Firebase gagal total, tetap lanjut pakai localStorage cache
    console.warn('Firebase gagal, pakai cache lokal:', e);
  }

  const s=DB.get('settings')||{};
  applyTheme();
  document.title=s.siteName||'MasAn Development';

  const sess=DB.get('session');
  if(!sess){renderAuth();}
  else if(sess.role==='founder'){renderFounder();}
  else if(sess.blocked){renderBlocked(sess);}
  else{
    renderCustomer(sess);
    const hash=location.hash.replace('#','').trim();
    if(hash&&['home','products','social','account'].includes(hash)){
      setTimeout(()=>{
        const btn=document.getElementById('nav-'+hash);
        if(btn) btn.click();
      },50);
    }
  }
})();
</script>
</body>
</html>
