<style>

  *{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#000;--bg2:#0a0a0a;--bg3:#111;--border:#1a1a1a;--border2:#222;
    --text:#fff;--text2:#888;--text3:#444;--accent:#fff;--accent-text:#000;
    --radius:10px;--font:'Inter',sans-serif;
    --primary:#fff;--primary-text:#000;
  }
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden;}
  ::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:#0a0a0a;}::-webkit-scrollbar-thumb{background:#222;}

    background:var(--bg2);border:1px solid var(--border2);color:var(--text);

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;overflow-y:auto;}
  .modal{background:var(--bg2);border:1px solid var(--border2);border-radius:18px;padding:28px;width:100%;max-width:440px;position:relative;}

  .chat-bubble.them{background:#1a1a1a;color:#ddd;align-self:flex-start;border-bottom-left-radius:4px;}
  .chat-time{font-size:10px;color:#444;margin-bottom:10px;}
  .chat-time.me{text-align:right;}
  /* Typing indicator */
  .typing-indicator{display:flex;align-items:center;gap:4px;padding:10px 14px;background:#1a1a1a;border-radius:14px;border-bottom-left-radius:4px;width:fit-content;align-self:flex-start;margin-bottom:8px;}
  .typing-dot{width:7px;height:7px;background:#555;border-radius:50%;animation:typingBounce 1.2s infinite;}
  .typing-dot:nth-child(2){animation-delay:.2s;}
  .typing-dot:nth-child(3){animation-delay:.4s;}
  @keyframes typingBounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
  /* Saved accounts popup */
  .saved-accts-popup{position:absolute;bottom:calc(100% + 8px);left:0;right:0;background:#111;border:1px solid #222;border-radius:14px;padding:8px;z-index:200;box-shadow:0 8px 32px rgba(0,0,0,.8);animation:slideUp .2s;}
  /* Notification badge */
  .notif-badge{background:#ff4444;color:#fff;border-radius:10px;min-width:17px;height:17px;font-size:9px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;line-height:1;}
  .notif-badge-abs{position:absolute;top:-5px;right:-5px;}
  /* Push notification — top center like Android/iOS */

  @keyframes slideDownNotif{from{opacity:0;transform:translateX(-50%) translateY(-100%)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

<script>

const JSONBIN_KEY = '$2a$10$ethU97gAs0GdY/DxDuFtouxohpvAKXPXy2ma/rYMecnell/ktmW2G';

let _binId = '6a61d35bda38895dfe834cbb';

// ════════════════════════════════════════
// GITHUB FILE STORAGE
// ════════════════════════════════════════
const GITHUB_REPO  = 'masan-develope/ma-files';
const GITHUB_API   = 'https://api.github.com';

// Token diambil dari settings JSONBin — tidak hardcode di source
function getGithubToken(){
  const s=_cache.settings||{};
  return s.githubToken||'';
}

// Upload file ke GitHub repo, return download URL
async function uploadToGithub(file, productId){
  // Baca file sebagai base64
  const b64 = await new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=e=>res(e.target.result.split(',')[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });

  // Path di repo — per produk, pakai productId + nama file asli
  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,'_');
  const path = `products/${productId}/${safeName}`;

  // Cek apakah file sudah ada (untuk get SHA jika update)
  let sha = null;
  try{
    const chk = await fetch(`${GITHUB_API}/repos/${GITHUB_REPO}/contents/${path}`,{
      headers:{'Authorization':'Bearer '+getGithubToken(),'Accept':'application/vnd.github+json'}
    });
    if(chk.ok){const d=await chk.json();sha=d.sha;}
  }catch(e){}

  const body = {
    message:`Upload file produk: ${file.name}`,
    content: b64,
  };
  if(sha) body.sha = sha;

  const res = await fetch(`${GITHUB_API}/repos/${GITHUB_REPO}/contents/${path}`,{
    method:'PUT',
    headers:{'Authorization':'Bearer '+getGithubToken(),'Accept':'application/vnd.github+json','Content-Type':'application/json'},
    body: JSON.stringify(body),
  });
  if(!res.ok){const e=await res.json();throw new Error(e.message||'GitHub upload gagal');}
  const data = await res.json();
  // Kembalikan path di repo (untuk generate download link nanti)
  return {path, fileName: file.name, size: file.size};
}

// Generate temporary download URL via GitHub API (authenticated)
async function getGithubDownloadUrl(path){
  const res = await fetch(`${GITHUB_API}/repos/${GITHUB_REPO}/contents/${path}`,{
    headers:{'Authorization':'Bearer '+getGithubToken(),'Accept':'application/vnd.github+json'}
  });
  if(!res.ok) throw new Error('File tidak ditemukan di server');
  const data = await res.json();
  // download_url dari GitHub = direct link dengan auth sudah embed untuk private repo
  return data.download_url;
}

// Hapus file dari GitHub repo
async function deleteFromGithub(path){
  try{
    const chk = await fetch(`${GITHUB_API}/repos/${GITHUB_REPO}/contents/${path}`,{
      headers:{'Authorization':'Bearer '+getGithubToken(),'Accept':'application/vnd.github+json'}
    });
    if(!chk.ok) return;
    const d = await chk.json();
    await fetch(`${GITHUB_API}/repos/${GITHUB_REPO}/contents/${path}`,{
      method:'DELETE',
      headers:{'Authorization':'Bearer '+getGithubToken(),'Accept':'application/vnd.github+json','Content-Type':'application/json'},
      body: JSON.stringify({message:'Hapus file produk',sha:d.sha}),
    });
  }catch(e){console.warn('deleteFromGithub gagal:',e);}
}
const IMGBB_KEY = 'ea0cc6165042587bc63a5614caa708a2';

// Upload 1 file ke imgbb, return URL string
async function uploadToImgbb(fileOrBase64){
  const form = new FormData();
  if(typeof fileOrBase64 === 'string'){
    // base64 string — strip header dulu
    const b64 = fileOrBase64.includes(',') ? fileOrBase64.split(',')[1] : fileOrBase64;
    form.append('image', b64);
  } else {
    // File object langsung
    form.append('image', fileOrBase64);
  }
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
    method: 'POST',
    body: form,
  });
  if(!res.ok) throw new Error('imgbb upload gagal: '+res.status);
  const data = await res.json();
  if(!data.success) throw new Error('imgbb error: '+(data.error?.message||'unknown'));
  return data.data.url; // URL permanen
}

// Upload banyak file sekaligus, return array URL
async function uploadManyToImgbb(filesOrBase64Array, onProgress){
  const urls = [];
  for(let i=0; i<filesOrBase64Array.length; i++){
    if(onProgress) onProgress(i+1, filesOrBase64Array.length);
    const url = await uploadToImgbb(filesOrBase64Array[i]);
    urls.push(url);
  }
  return urls;
}

const DEFAULT_DATA = {
  settings:{
    siteName:'MasAn Development',
    tagline:'Build Smarter. Deliver Faster.',
    logo:'',font:'Inter',theme:'dark',accentColor:'#ffffff',borderRadius:'10',
    maintenanceMode:false,maintenanceMsg:'Sedang dalam maintenance. Silakan coba lagi nanti.',
    socialLinks:[
      {label:'WhatsApp',url:'https://wa.me/6281234567890',icon:'💬'},
      {label:'Discord',url:'https://discord.gg/example',icon:'🎮'},
      {label:'Instagram',url:'https://instagram.com/masandev',icon:'📸'},
    ],
    founderEmail:'founder@masandev.com',founderPass:'MasAnFounder2025!',
    supportEmail:'support@masandev.com',copyright:'© 2025 MasAn Development. All rights reserved.',
    customCSS:'',announcementBar:'',announcementBarOn:false,
    heroBanner:'',
  },
  products:[
    {id:'p1',name:'Roblox Game System',price:'Rp 150.000',desc:'Full game system dengan UI, admin panel, dan DataStore.',detail:'Termasuk: GUI kustom, RemoteEvent, ModuleScript, admin commands, DataStore persistence. Delivery 5 hari kerja.',thumb:'',category:'Roblox'},
    {id:'p2',name:'Discord Bot',price:'Rp 100.000',desc:'Bot Discord custom sesuai kebutuhan server kamu.',detail:'Fitur: slash commands, auto-role, welcome message, moderation tools. Bahasa: Node.js/discord.js.',thumb:'',category:'Bot'},
    {id:'p3',name:'Web Landing Page',price:'Rp 200.000',desc:'Landing page modern dan responsif untuk bisnis kamu.',detail:'Teknologi: React + Tailwind. Fitur: animasi, dark mode, mobile-friendly. Delivery 7 hari.',thumb:'',category:'Web'},
  ],
  users:[],orders:[],appeals:[],chats:[],testimoni:[],
};

// ════════════════════════════════════════
// STORAGE
// ════════════════════════════════════════
let _cache = {};
let _saveTimer = null;
let _pushInProgress = false;
let _pushQueued = false;
let _lastSentAt = 0; // timestamp terakhir kali user kirim pesan/typing

function _localGet(k){try{return JSON.parse(localStorage.getItem('ma_'+k));}catch{return null;}}
function _localSet(k,v){try{localStorage.setItem('ma_'+k,JSON.stringify(v));}catch{}}

// Saved accounts (multi-account quick login)
function getSavedAccounts(){try{return JSON.parse(localStorage.getItem('ma_saved_accounts'))||[];}catch{return[];}}
function saveAccount(user){
  let accts=getSavedAccounts();
  accts=accts.filter(a=>a.email!==user.email);
  accts.unshift({email:user.email,name:user.name,id:user.id,pass:user.pass,avatar:user.name?.[0]?.toUpperCase()||'?'});
  if(accts.length>5)accts=accts.slice(0,5);
  localStorage.setItem('ma_saved_accounts',JSON.stringify(accts));
}
function removeSavedAccount(email){
  let accts=getSavedAccounts().filter(a=>a.email!==email);
  localStorage.setItem('ma_saved_accounts',JSON.stringify(accts));
}

const DB = {
  get(k){
    if(k==='session') return _localGet('session');
    return _cache[k] !== undefined ? _cache[k] : _localGet(k);
  },
  set(k,v){
    if(k==='session'){_localSet('session',v);return;}
    _cache[k]=v;
    _localSet(k,v);
    clearTimeout(_saveTimer);
    if(k==='orders'||k==='users'||k==='testimoni'||k==='products'){DB._push();}
    // chats: debounce 300ms — cepat tapi tetap batch typing + message sekaligus
    else if(k==='chats'){_saveTimer=setTimeout(()=>DB._push(),300);}
    else{_saveTimer=setTimeout(()=>DB._push(),800);}
  },
  async _push(){
    if(!_binId) return;
    // Kalau sedang push, queue sekali lagi supaya tidak saling timpa
    if(_pushInProgress){_pushQueued=true;return;}
    _pushInProgress=true;
    const data={
      settings:_cache.settings||DEFAULT_DATA.settings,
      products:_cache.products||DEFAULT_DATA.products,
      users:_cache.users||[],
      orders:_cache.orders||[],
      appeals:_cache.appeals||[],
      chats:_cache.chats||[],
      testimoni:_cache.testimoni||[],
    };
    try{
      const res=await fetch(`${JSONBIN_API}/b/${_binId}`,{
        method:'PUT',
        headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY},
        body:JSON.stringify(data),
      });
      if(!res.ok) console.warn('JSONBin push gagal status:',res.status);
    }catch(e){console.warn('JSONBin push gagal:',e);}
    finally{
      _pushInProgress=false;
      if(_pushQueued){_pushQueued=false;setTimeout(()=>DB._push(),50);}
    }
  },
  async init(){
    try{
      const res = await fetch(`${JSONBIN_API}/b/${_binId}/latest`,{
        headers:{'X-Master-Key':JSONBIN_KEY,'X-Bin-Meta':false},
      });
      if(res.ok){
        const data = await res.json();
        _cache.settings = {...DEFAULT_DATA.settings,...(data.settings||{})};
        _cache.products = data.products||DEFAULT_DATA.products;
        _cache.users    = data.users||[];
        _cache.orders   = data.orders||[];
        _cache.appeals  = data.appeals||[];
        _cache.chats    = data.chats||[];
        _cache.testimoni= data.testimoni||[];
        Object.keys(_cache).forEach(k=>_localSet(k,_cache[k]));
        return;
      }
    }catch(e){console.warn('JSONBin load gagal, pakai cache lokal:',e);}
    _cache.settings = _localGet('settings')||{...DEFAULT_DATA.settings};
    _cache.products = _localGet('products')||[...DEFAULT_DATA.products];
    _cache.users    = _localGet('users')||[];
    _cache.orders   = _localGet('orders')||[];
    _cache.appeals  = _localGet('appeals')||[];
    _cache.chats    = _localGet('chats')||[];
    _cache.testimoni= _localGet('testimoni')||[];
  }
};

const uid=()=>Math.random().toString(36).slice(2,10);
const now=()=>new Date().toLocaleString('id-ID');

// ════════════════════════════════════════
// REAL-TIME POLLING (untuk detect blokir, chat, order notif)
// ════════════════════════════════════════
let _pollTimer=null;
let _lastOrderCount=0;
let _lastChatCount=0;
let _currentSession=null;

function startPolling(session){
  _currentSession=session;
  if(_pollTimer)clearInterval(_pollTimer);
  const isFounder=session?.role==='founder';
  _lastOrderCount=(DB.get('orders')||[]).length;
  // Init dari data aktual supaya polling pertama tidak trigger notif palsu
  const _initChats=DB.get('chats')||[];
  _lastChatCount=_initChats.reduce((a,c)=>a+(c.messages?.length||0),0);

  _pollTimer=setInterval(async()=>{
    try{
      const res=await fetch(`${JSONBIN_API}/b/${_binId}/latest`,{
        headers:{'X-Master-Key':JSONBIN_KEY,'X-Bin-Meta':false},
      });
      if(!res.ok)return;
      const data=await res.json();

      // Update cache silently — hanya jika data valid array/object
      if(Array.isArray(data.users)) _cache.users=data.users;
      if(Array.isArray(data.orders)) _cache.orders=data.orders;
      if(Array.isArray(data.appeals)) _cache.appeals=data.appeals;
      if(Array.isArray(data.testimoni)) _cache.testimoni=data.testimoni;
      // KRUSIAL: jangan timpa chats dari server jika user baru kirim pesan
      // dalam 5 detik terakhir — cegah race condition pesan hilang
      const msSinceSent=Date.now()-_lastSentAt;
      if(Array.isArray(data.chats)&&msSinceSent>5000){
        // Merge aman: ambil versi server, tapi protect pesan lokal yang belum terkirim
        // Cek tiap chat — jika lokal punya lebih banyak pesan, pertahankan lokal
        const localChats=_cache.chats||[];
        const serverChats=data.chats;
        const merged=serverChats.map(sc=>{
          const lc=localChats.find(l=>l.id===sc.id);
          if(lc&&(lc.messages?.length||0)>(sc.messages?.length||0)){
            // Lokal lebih banyak — kembalikan lokal dan trigger push
            setTimeout(()=>DB._push(),100);
            return lc;
          }
          return sc;
        });
        // Tambahkan chat lokal yang belum ada di server (baru dibuat)
        localChats.forEach(lc=>{
          if(!merged.find(m=>m.id===lc.id)) merged.push(lc);
        });
        _cache.chats=merged;
        _localSet('chats',merged);
      } else if(Array.isArray(data.chats)&&msSinceSent<=5000){
        // Dalam window proteksi — skip overwrite, tapi catat kalau server lebih update
        // (user lain mungkin juga kirim pesan)
        const localChats=_cache.chats||[];
        const serverChats=data.chats;
        let anyServerNewer=false;
        serverChats.forEach(sc=>{
          const lc=localChats.find(l=>l.id===sc.id);
          if(!lc||(sc.messages?.length||0)>(lc.messages?.length||0)) anyServerNewer=true;
        });
        if(anyServerNewer){
          // Merge: ambil yang lebih banyak pesannya per chat
          const merged=serverChats.map(sc=>{
            const lc=localChats.find(l=>l.id===sc.id);
            if(lc&&(lc.messages?.length||0)>=(sc.messages?.length||0)) return lc;
            return sc;
          });
          localChats.forEach(lc=>{if(!merged.find(m=>m.id===lc.id))merged.push(lc);});
          _cache.chats=merged;
          _localSet('chats',merged);
        }
      }
      // Sync key lain ke localStorage
      ['users','orders','appeals','testimoni'].forEach(k=>{if(_cache[k]!==undefined)_localSet(k,_cache[k]);});

      if(!isFounder){
        // Cek apakah user ini diblokir
        const users=_cache.users||[];
        if(users.length>0){
          const me=users.find(u=>u.id===session.id);
          if(me&&me.blocked){stopPolling();DB.set('session',null);renderBlocked(me);return;}
        }
        // Update badge chat + notif pesan founder → customer
        if(Array.isArray(_cache.chats)){
          const myChats=_cache.chats.filter(c=>c.userId===session.id||c.userEmail===session.email);
          let totalUnread=0;
          let newFounderMsg=null;
          const _prevTotalKey='ma_cust_total_msgs_'+session.id;
          const prevTotal=parseInt(localStorage.getItem(_prevTotalKey)||'0');
          let newTotal=0;
          myChats.forEach(myChat=>{
            const lastRead=parseInt(localStorage.getItem('ma_cust_read_'+myChat.id)||'0');
            const msgs=myChat.messages||[];
            newTotal+=msgs.length;
            for(let i=lastRead;i<msgs.length;i++){
              if(msgs[i].role==='founder'){totalUnread++;newFounderMsg=msgs[i];}
            }
          });
          // Push notif ke customer kalau ada pesan baru dari founder
          if(newTotal>prevTotal&&prevTotal>0&&newFounderMsg){
            showPushNotif('💬 MasAn Dev',newFounderMsg.text?.slice(0,80)||'Pesan baru','chat',null,null);
            sendPushNotif('💬 MasAn Dev',newFounderMsg.text?.slice(0,80)||'Pesan baru',session.id,null);
          }
          if(newTotal>0)localStorage.setItem(_prevTotalKey,String(newTotal));
          // Update badge
          const navChatBtn=document.getElementById('nav-chat');
          if(navChatBtn){
            const existBadge=navChatBtn.querySelector('#chat-nav-badge');
            if(existBadge)existBadge.remove();
            if(totalUnread>0){
              const iconWrap=navChatBtn.querySelector('div');
              if(iconWrap){const b=document.createElement('span');b.id='chat-nav-badge';b.style.cssText='position:absolute;top:-4px;right:-6px;background:#25d366;color:#fff;border-radius:10px;min-width:16px;height:16px;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 3px;';b.textContent=totalUnread>99?'99+':String(totalUnread);iconWrap.appendChild(b);}
            }
          }
        }
        // Notif order done ke customer
        if(Array.isArray(_cache.orders)){
          const myOrders=_cache.orders.filter(o=>o.userId===session.id||o.userEmail===session.email);
          const _doneKey='ma_cust_notif_done_'+session.id;
          const alreadyNotified=JSON.parse(localStorage.getItem(_doneKey)||'[]');
          myOrders.forEach(o=>{
            if(o.status==='done'&&!alreadyNotified.includes(o.id)){
              showPushNotif('✅ Order Selesai!',`Order "${o.productName||'?'}" kamu sudah di-acc!`,'orders',null,null);
              sendPushNotif('✅ Order Selesai!',`Order "${o.productName||'?'}" kamu sudah di-acc!`,session.id,null);
              alreadyNotified.push(o.id);
            }
          });
          localStorage.setItem(_doneKey,JSON.stringify(alreadyNotified));
        }
      }

      if(isFounder){
        // Notifikasi order baru
        const orders=data.orders||[];
        if(orders.length>_lastOrderCount&&_lastOrderCount>0){
          const newOrder=orders[orders.length-1];
          if(newOrder){
            showPushNotif('📦 Order Baru!',`${newOrder.userName||'?'} memesan ${newOrder.productName||'?'}`,'orders',null,null);
            sendPushNotif('📦 Order Baru!',`${newOrder.userName||'?'} memesan ${newOrder.productName||'?'}`,null,'founder');
          }
        }
        _lastOrderCount=orders.length;

        // Notifikasi chat baru — cek pesan terbaru dari customer
        const chats=Array.isArray(data.chats)?data.chats:[];
        let totalMsgs=chats.reduce((a,c)=>a+(c.messages?.length||0),0);
        if(totalMsgs>_lastChatCount&&_lastChatCount>=0&&_lastChatCount!==totalMsgs){
          // Cari pesan baru dari customer
          for(const chat of [...chats].reverse()){
            const msgs=chat.messages||[];
            const lastMsg=msgs[msgs.length-1];
            if(lastMsg&&lastMsg.role==='customer'){
              const senderName=chat.userName||'Customer';
              showPushNotif('💬 '+senderName,lastMsg.text?.slice(0,80)||'','chat',chat.id,senderName);
              sendPushNotif('💬 '+senderName,lastMsg.text?.slice(0,80)||'',null,'founder');
              break;
            }
          }
        }
        _lastChatCount=totalMsgs;

        // Update badge di sidebar
        updateFounderBadges(data);
      }
    }catch(e){}
  }, 3000); // poll tiap 3 detik
}

// Push notification — tampil seperti Android/iOS notification bar
function showPushNotif(title,body,tabTarget,chatId,senderName){

  const old=document.getElementById('ma-push-notif');
  if(old&&old.parentNode)old.parentNode.removeChild(old);

  const icon=tabTarget==='chat'?'💬':tabTarget==='orders'?'📦':'🔔';
  const el=document.createElement('div');
  el.className='push-notif';
  el.id='ma-push-notif';

  // Cek apakah ini chat (bisa reply langsung)
  const isChat=tabTarget==='chat'&&chatId;

  el.innerHTML=`
    <div class="pn-icon">${icon}</div>
    <div class="pn-content">
      <div class="pn-app">MasAn Development</div>
      <div class="pn-title">${sanitize(title)}</div>
      <div class="pn-body">${sanitize(body)}</div>
      ${isChat?`<div id="pn-reply-wrap" style="margin-top:8px;display:none;"><input id="pn-reply-inp" type="text" placeholder="Balas..." style="background:#2a2a2a;border:1px solid #333;color:#fff;padding:7px 10px;border-radius:8px;font-size:12px;width:100%;outline:none;"><button id="pn-reply-btn" style="margin-top:6px;background:#fff;color:#000;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;width:100%;">Kirim</button></div>`:''}
    </div>
    <button class="pn-close" id="pn-close-btn">✕</button>
  `;

  document.body.appendChild(el);

  // Close btn
  document.getElementById('pn-close-btn').addEventListener('click',e=>{e.stopPropagation();if(el.parentNode)el.parentNode.removeChild(el);});

  // Click body → buka tab
  el.addEventListener('click',e=>{
    if(e.target.id==='pn-close-btn'||e.target.id==='pn-reply-inp'||e.target.id==='pn-reply-btn')return;
    if(isChat){
      const rw=document.getElementById('pn-reply-wrap');
      if(rw){rw.style.display=rw.style.display==='none'?'block':'none';if(rw.style.display==='block')document.getElementById('pn-reply-inp')?.focus();return;}

    if(el.parentNode)el.parentNode.removeChild(el);
    if(tabTarget&&window._founderSetTab) window._founderSetTab(tabTarget);

  // Reply langsung dari notif
  if(isChat){
    const sendReply=()=>{
      const inp=document.getElementById('pn-reply-inp');

      if(!txt)return;
      sendChatMessage(chatId,txt,'founder');
      inp.value='';
      showToast('✅ Pesan terkirim');
      setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},500);
    };
    setTimeout(()=>{
      document.getElementById('pn-reply-btn')?.addEventListener('click',sendReply);
      document.getElementById('pn-reply-inp')?.addEventListener('keydown',e=>{if(e.key==='Enter')sendReply();});
    },100);
  }

  // Auto hide setelah 10 detik
  setTimeout(()=>{
    if(el.parentNode){el.style.animation='slideDownNotifOut .3s forwards';setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},300);}
  },10000);

  // Web Notifications API (muncul di HP jika diizinkan)
  if('Notification' in window&&Notification.permission==='granted'){
    try{
      const n=new Notification(title,{
        body,
        icon:'https://masan-develope.github.io/favicon.ico',
        tag:'masandev-'+tabTarget,
        renotify:true,
        requireInteraction:false,
      });
      n.onclick=()=>{window.focus();if(tabTarget&&window._founderSetTab)window._founderSetTab(tabTarget);};
    }catch(e){}
  }

// ════════════════════════════════════════
// RENDER HELPERS
// ════════════════════════════════════════
function h(tag,attrs={},children=[]){
  const el=document.createElement(tag);
  for(const[k,v] of Object.entries(attrs)){
    if(k==='style'&&typeof v==='object'){Object.assign(el.style,v);}
    else if(k.startsWith('on')&&typeof v==='function'){el.addEventListener(k.slice(2).toLowerCase(),v);}
    else if(k==='class'){el.className=v;}
    else if(k==='html'){el.innerHTML=v;}
    else{el.setAttribute(k,v);}
  }
  for(const c of children){
    if(c==null||c===false||c===undefined)continue;
    el.appendChild(typeof c==='string'?document.createTextNode(c):c);
  }
  return el;
}
function render(el){const app=document.getElementById('app');app.innerHTML='';app.appendChild(el);}
function sanitize(str){if(typeof str!=='string')str=String(str||'');return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;').replace(/\//g,'&#x2F;');}
function strip(str){if(typeof str!=='string')str=String(str||'');return str.replace(/<[^>]*>/g,'').trim();}
function safeUrl(url){try{const u=new URL(url);return(u.protocol==='http:'||u.protocol==='https:')?url:'#';}catch{return'#';}}
function safeText(el,str){el.textContent=strip(str);}

// CAPTCHA — Multi-layer (math + drag + pattern)
// ════════════════════════════════════════
function captchaWidget(onVerify){
  // Random pilih tipe captcha
  const type=Math.floor(Math.random()*3);
  if(type===0) return captchaMath(onVerify);
  if(type===1) return captchaSlider(onVerify);
  return captchaPattern(onVerify);
}

function captchaMath(onVerify){
  const ops=['+','-','×'];
  const op=ops[Math.floor(Math.random()*ops.length)];
  const a=Math.floor(Math.random()*9)+1, b=Math.floor(Math.random()*9)+1;
  let answer;
  if(op==='+')answer=a+b;
  else if(op==='-')answer=a-b;
  else answer=a*b;
  let inp;
  let tries=0;
  const wrap=h('div',{style:{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'12px',padding:'20px',marginBottom:'16px'}},[
    h('p',{style:{color:'var(--text2)',fontSize:'11px',marginBottom:'6px',textTransform:'uppercase',letterSpacing:'1px'}},'Verifikasi Keamanan 🔒'),
    h('p',{style:{color:'var(--text)',fontWeight:700,fontSize:'18px',marginBottom:'14px',letterSpacing:'2px'}},`${a} ${op} ${b} = ?`),
    h('p',{style:{color:'var(--text3)',fontSize:'11px',marginBottom:'10px'}},'Hitung dan masukkan jawabannya'),
    h('div',{style:{display:'flex',gap:'10px'}},[
      (inp=h('input',{type:'number',placeholder:'Jawaban',style:{maxWidth:'120px'}})),
      h('button',{class:'btn-w',style:{padding:'10px 18px',fontSize:'13px'},onClick(){
        tries++;
        if(parseInt(inp.value)===answer){onVerify();}
        else{
          inp.value='';
          inp.style.borderColor='#ff4444';
          showToast(`Jawaban salah! (${tries}x)`, 'err');
          if(tries>=3){showToast('Terlalu banyak percobaan salah.','err');}
          setTimeout(()=>{inp.style.borderColor='';},1000);
        }
      }},'Verifikasi'),
    ]),
  ]);
  return wrap;
}

function captchaSlider(onVerify){
  let verified=false;
  const target=Math.floor(Math.random()*60)+20; // 20-80%
  let slider;
  const trackEl=h('div',{style:{width:'100%',height:'8px',background:'#222',borderRadius:'4px',position:'relative',marginBottom:'8px',cursor:'pointer'}});
  const fillEl=h('div',{style:{height:'100%',background:'var(--primary)',borderRadius:'4px',width:'0%',transition:'width .1s'}});
  const thumbEl=h('div',{style:{width:'28px',height:'28px',background:'var(--primary)',borderRadius:'50%',position:'absolute',top:'50%',transform:'translateY(-50%)',left:'0%',cursor:'grab',boxShadow:'0 2px 8px rgba(0,0,0,.5)',transition:'left .1s'}});
  trackEl.appendChild(fillEl);
  trackEl.appendChild(thumbEl);
  const labelEl=h('p',{style:{color:'var(--text3)',fontSize:'11px',marginBottom:'6px'}},`Geser slider ke ${target}%`);

  let dragging=false;
  function onMove(clientX){
    const rect=trackEl.getBoundingClientRect();
    let pct=Math.max(0,Math.min(100,((clientX-rect.left)/rect.width)*100));
    fillEl.style.width=pct+'%';
    thumbEl.style.left=`calc(${pct}% - 14px)`;
    if(Math.abs(pct-target)<=5&&!verified){
      verified=true;
      setTimeout(onVerify,300);
      showToast('✅ Verifikasi berhasil!');
    }
  }
  thumbEl.addEventListener('mousedown',()=>{dragging=true;});
  document.addEventListener('mousemove',e=>{if(dragging)onMove(e.clientX);});
  document.addEventListener('mouseup',()=>{dragging=false;});
  thumbEl.addEventListener('touchstart',e=>{dragging=true;e.preventDefault();},{passive:false});
  document.addEventListener('touchmove',e=>{if(dragging)onMove(e.touches[0].clientX);},{passive:true});
  document.addEventListener('touchend',()=>{dragging=false;});

  return h('div',{style:{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'12px',padding:'20px',marginBottom:'16px'}},[
    h('p',{style:{color:'var(--text2)',fontSize:'11px',marginBottom:'6px',textTransform:'uppercase',letterSpacing:'1px'}},'Verifikasi Keamanan 🔒'),
    labelEl,
    trackEl,
    h('p',{style:{color:'var(--text3)',fontSize:'10px',marginTop:'8px'}},'Geser ke posisi yang tepat untuk membuktikan kamu bukan robot'),
  ]);
}

function captchaPattern(onVerify){
  const icons=['🐶','🐱','🦊','🐻','🐼','🦁','🐯','🐮','🐷'];
  const target=icons[Math.floor(Math.random()*icons.length)];
  const shuffled=[...icons].sort(()=>Math.random()-.5).slice(0,6);
  if(!shuffled.includes(target))shuffled[0]=target;
  shuffled.sort(()=>Math.random()-.5);
  let clicks=[];
  const targetCount=Math.floor(Math.random()*2)+2;
  const targetPositions=[];
  while(targetPositions.length<targetCount){
    const i=Math.floor(Math.random()*shuffled.length);
    if(shuffled[i]===target&&!targetPositions.includes(i))targetPositions.push(i);
  }
  // Ensure enough targets
  let placed=0;
  for(let i=0;i<shuffled.length&&placed<targetCount;i++){shuffled[i]=target;placed++;}
  shuffled.sort(()=>Math.random()-.5);

  const grid=h('div',{style:{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'8px',marginBottom:'12px'}});
  shuffled.forEach((icon,i)=>{
    const btn=h('div',{style:{background:'#1a1a1a',border:'1px solid #222',borderRadius:'10px',padding:'14px',textAlign:'center',fontSize:'24px',cursor:'pointer',transition:'all .2s',userSelect:'none'}},icon);
    btn.addEventListener('click',()=>{
      const ci=clicks.indexOf(i);
      if(ci===-1){clicks.push(i);btn.style.border='2px solid var(--primary)';btn.style.background='#2a2a2a';}
      else{clicks.splice(ci,1);btn.style.border='1px solid #222';btn.style.background='#1a1a1a';}
    });
    grid.appendChild(btn);
  });

  const countOfTarget=shuffled.filter(x=>x===target).length;

  return h('div',{style:{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:'12px',padding:'20px',marginBottom:'16px'}},[
    h('p',{style:{color:'var(--text2)',fontSize:'11px',marginBottom:'6px',textTransform:'uppercase',letterSpacing:'1px'}},'Verifikasi Keamanan 🔒'),
    h('p',{style:{color:'var(--text)',fontWeight:700,fontSize:'14px',marginBottom:'10px'}},`Klik SEMUA gambar ${target} (ada ${countOfTarget})`),
    grid,
    h('button',{class:'btn-w',style:{width:'100%',padding:'10px'},onClick(){
      // Count which clicked icons are the target
      const correct=clicks.filter(i=>shuffled[i]===target).length;
      const wrong=clicks.filter(i=>shuffled[i]!==target).length;
      if(correct===countOfTarget&&wrong===0){onVerify();}
      else{clicks=[];Array.from(grid.children).forEach(b=>{b.style.border='1px solid #222';b.style.background='#1a1a1a';});showToast('Pilihan salah, coba lagi.','err');}
    }},'Konfirmasi'),
  ]);
}

// AUTH SCREEN — UPGRADED

function renderAuth(){
  const s=DB.get('settings')||{};

  if(s.maintenanceMode){
    render(h('div',{style:{minHeight:'100vh',background:'var(--bg)',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',padding:'24px',textAlign:'center'}},[

      h('p',{style:{color:'var(--text2)',fontSize:'14px',maxWidth:'320px',lineHeight:1.7}},s.maintenanceMsg||'Sedang dalam maintenance.'),
      // FOUNDER LOGIN — TERSEMBUNYI, tidak ada label "Founder Login"
      (() => {
        const wrap=h('div',{style:{marginTop:'40px',opacity:0,height:'1px',overflow:'hidden'}});
        let tapCount=0;
        let tapTimer=null;
        // Ketuk logo 5x untuk reveal founder login
        const logo=logoEl(60);
        logo.style.display='block';
        logo.style.margin='0 auto';
        logo.style.opacity='0.2';
        logo.style.cursor='pointer';
        logo.addEventListener('click',()=>{
          tapCount++;
          clearTimeout(tapTimer);
          if(tapCount>=5){
            tapCount=0;
            const pass=prompt('🔑');
            const ss=DB.get('settings')||{};
            if(pass===ss.founderPass){
              DB.set('session',{email:ss.founderEmail,name:'Founder',role:'founder',id:'founder'});
              renderFounder();
            } else {showToast('Salah','err');}
          }
          tapTimer=setTimeout(()=>{tapCount=0;},2000);
        });
        const outer=h('div',{style:{marginTop:'48px'}},[ logo ]);
        return outer;
      })(),
    ]));
    return;
  }

  let mode = 'login';
  let nameInp=null, emailInp=null, passInp=null, phoneInp=null, errEl=null;
  let captchaVerified=false;
  let showSavedAccts=false;

  function submit(){
    if(!errEl)return;
    errEl.textContent='';
    const email=emailInp?emailInp.value.trim():'';
    const pass=passInp?passInp.value:'';
    const name=nameInp?nameInp.value.trim():'';
    if(!email||!pass){errEl.textContent='Email dan password wajib diisi.';return;}

    const cleanEmail=strip(email).toLowerCase();
    const cleanName=strip(name);
    const s2=DB.get('settings')||{};

    if(cleanEmail===s2.founderEmail&&pass===s2.founderPass){
      DB.set('session',{email:cleanEmail,name:'Founder',role:'founder',id:'founder'});
      renderFounder();return;
    }

    const users=DB.get('users')||[];
    if(mode==='login'){
      const user=users.find(u=>u.email===cleanEmail&&u.pass===pass);
      if(!user){errEl.textContent='Email atau password salah.';return;}
      if(user.blocked){renderBlocked(user);return;}
      DB.set('session',user);
      saveAccount(user);
      startPolling(user);
      renderCustomer(user);
    } else {
      if(!captchaVerified){errEl.textContent='Selesaikan verifikasi terlebih dahulu.';return;}
      if(!cleanName){errEl.textContent='Nama wajib diisi.';return;}
      if(users.find(u=>u.email===cleanEmail)){errEl.textContent='Email sudah terdaftar.';return;}
      if(pass.length<6){errEl.textContent='Password minimal 6 karakter.';return;}
      const user={id:uid(),email:cleanEmail,pass,name:cleanName,role:'customer',blocked:false,createdAt:now(),phone:strip(phoneInp?.value||''),loginMethod:'email'};
      DB.set('users',[...users,user]);
      DB.set('session',user);
      saveAccount(user);
      showToast('Akun berhasil dibuat!');
      startPolling(user);
      renderCustomer(user);
    }
  }

  // Quick login from saved account
  function quickLogin(acct){
    const users=DB.get('users')||[];
    const user=users.find(u=>u.email===acct.email&&u.pass===acct.pass);
    if(!user){showToast('Akun tidak ditemukan atau password berubah.','err');removeSavedAccount(acct.email);buildForm();return;}
    if(user.blocked){renderBlocked(user);return;}
    DB.set('session',user);
    saveAccount(user);
    startPolling(user);
    renderCustomer(user);

  // Google login — tampilan mirip Google account picker asli

    function getColor(email){const code=email.charCodeAt(0)+email.charCodeAt(email.length-1);return avatarColors[code%avatarColors.length];}

    function doGoogleLogin(email,name){
      if(bg.parentNode)document.body.removeChild(bg);

  function showPhoneLogin(){
    const bg=h('div',{class:'modal-bg',style:{zIndex:2000}},[
      h('div',{class:'modal',style:{maxWidth:'360px',textAlign:'center'}},[
        h('div',{style:{fontSize:'32px',marginBottom:'12px'}},'📱'),
        h('h3',{style:{fontWeight:800,fontSize:'18px',marginBottom:'6px'}},'Login dengan Nomor HP'),
        (() => {
          let step=1;
          const wrap=h('div',{id:'phone-step'});
          function buildStep(){
            wrap.innerHTML='';
            if(step===1){
              const phoneI=h('input',{type:'tel',placeholder:'+62 812 3456 7890',style:{marginBottom:'10px'}});
              const nameI=h('input',{type:'text',placeholder:'Nama (untuk akun baru)',style:{marginBottom:'16px'}});
              const errP=h('p',{style:{color:'#ff4444',fontSize:'12px',marginBottom:'10px'}});

              wrap.appendChild(phoneI);wrap.appendChild(nameI);wrap.appendChild(errP);
              wrap.appendChild(h('button',{class:'btn-w',style:{width:'100%',padding:'12px'},onClick(){
                const ph=strip(phoneI.value.trim());
                const nm=strip(nameI.value.trim());
                if(!ph||ph.length<8){errP.textContent='Nomor HP tidak valid';return;}
                // Simulate OTP
                const otp=String(Math.floor(100000+Math.random()*900000));
                localStorage.setItem('ma_otp_temp',JSON.stringify({otp,phone:ph,name:nm,exp:Date.now()+300000}));
                showToast('Kode OTP: '+otp+' (demo)');
                step=2;buildStep(ph,nm);
              }},'Kirim Kode OTP'),
              h('button',{style:{width:'100%',background:'none',border:'none',color:'#444',padding:'10px',fontSize:'13px'},onClick(){document.body.removeChild(bg);}},'Batal'));
            } else {
              const otpI=h('input',{type:'number',placeholder:'Masukkan 6 digit OTP',style:{marginBottom:'16px',letterSpacing:'8px',textAlign:'center',fontSize:'20px'}});
              const errP=h('p',{style:{color:'#ff4444',fontSize:'12px',marginBottom:'10px'}});
              wrap.appendChild(h('p',{style:{color:'var(--text3)',fontSize:'13px',marginBottom:'16px'}},'Masukkan kode OTP yang dikirim'));
              wrap.appendChild(otpI);wrap.appendChild(errP);
              wrap.appendChild(h('button',{class:'btn-w',style:{width:'100%',padding:'12px'},onClick(){
                const stored=JSON.parse(localStorage.getItem('ma_otp_temp')||'null');
                if(!stored||Date.now()>stored.exp){errP.textContent='OTP kedaluwarsa, coba lagi.';step=1;buildStep();return;}
                if(otpI.value!==stored.otp){errP.textContent='Kode OTP salah.';return;}
                localStorage.removeItem('ma_otp_temp');
                document.body.removeChild(bg);
                const users=DB.get('users')||[];
                let user=users.find(u=>u.phone===stored.phone);
                if(!user){
                  user={id:uid(),email:stored.phone+'@phone.masandev',pass:'phone_'+uid(),name:stored.name||stored.phone,role:'customer',blocked:false,createdAt:now(),loginMethod:'phone',phone:stored.phone};
                  DB.set('users',[...users,user]);showToast('Akun berhasil dibuat!');

                if(user.blocked){renderBlocked(user);return;}
                DB.set('session',user);saveAccount(user);startPolling(user);renderCustomer(user);
              }},'Verifikasi OTP'),
              h('button',{style:{width:'100%',background:'none',border:'none',color:'#444',padding:'10px',fontSize:'13px'},onClick(){step=1;buildStep();}},'← Kembali'));
            }
          }
          buildStep();
          return wrap;
        })(),

    ]);

    h('div',{style:{marginBottom:'40px',textAlign:'center'}},[

      h('p',{style:{color:'var(--text2)',fontSize:'13px',marginTop:'6px'}},s.tagline||''),

  ]);

  buildForm();
}

function renderBlocked(user){
  let msgInp;
  function submitAppeal(){

function sendChatMessage(chatId,text,role){
  const chats=DB.get('chats')||[];
  const idx=chats.findIndex(c=>c.id===chatId);
  if(idx===-1)return;
  const msg={id:uid(),text:strip(text),role,time:now()};
  chats[idx].messages.push(msg);
  chats[idx].lastActivity=now();
  // Simpan ke lokal dulu SEGERA — sebelum push ke server
  _localSet('chats',chats);
  _cache.chats=chats;
  // Set lastSentAt panjang (10 detik) biar polling tidak timpa sebelum push selesai
  _lastSentAt=Date.now();
  // Push ke server dengan retry jika gagal
  (async()=>{
    let retries=0;
    while(retries<3){
      try{
        const res=await fetch(`${JSONBIN_API}/b/${_binId}`,{
          method:'PUT',
          headers:{'Content-Type':'application/json','X-Master-Key':JSONBIN_KEY},
          body:JSON.stringify({
            users:_cache.users||[],
            orders:_cache.orders||[],
            appeals:_cache.appeals||[],
            chats:_cache.chats||[],
            testimoni:_cache.testimoni||[],
            settings:_cache.settings||{},
            products:_cache.products||[],
          }),
        });
        if(res.ok){_lastSentAt=Date.now();break;}
      }catch(e){}
      retries++;
      await new Promise(r=>setTimeout(r,800));
    }
  })();
}

// Typing state per chat (simpan di memory saja)
const _typingState={}; // chatId → {role, expires}

function setTyping(chatId, role, isTyping){
  const chats=DB.get('chats')||[];
  const idx=chats.findIndex(c=>c.id===chatId);
  if(idx===-1)return;
  if(isTyping){chats[idx].typing=role;chats[idx].typingExp=Date.now()+4000;}
  else{delete chats[idx].typing;delete chats[idx].typingExp;}
  DB.set('chats',chats);
}

function buildChatUI(chatId, myRole, onClose){
  let chat=((DB.get('chats')||[]).find(c=>c.id===chatId));
  let pollChat;
  let typingTimer=null;
  let lastMsgCount=chat?.messages?.length||0;

  const msgsEl=h('div',{style:{flex:1,overflowY:'auto',padding:'16px',display:'flex',flexDirection:'column',gap:'0px',minHeight:'0'}});
  const inputEl=h('input',{type:'text',placeholder:'Ketik pesan...',style:{flex:1}});
  const sendBtn=h('button',{class:'btn-w',style:{padding:'10px 18px',flexShrink:0}}, '➤');

  function renderMsgs(newData){
    const prevScroll=msgsEl.scrollTop;
    const atBottom=msgsEl.scrollHeight-msgsEl.clientHeight-prevScroll<40;

    msgsEl.innerHTML='';
    const src=newData||DB.get('chats')||[];
    chat=src.find(c=>c.id===chatId);
    if(!chat)return;

    chat.messages.forEach(msg=>{
      const isMe=msg.role===myRole;
      const bubble=h('div',{class:'chat-bubble '+(isMe?'me':'them')},msg.text);
      const time=h('div',{class:'chat-time '+(isMe?'me':'')},msg.time);
      msgsEl.appendChild(bubble);
      msgsEl.appendChild(time);
    });

    // Typing indicator — tampilkan jika pihak lain sedang mengetik
    const otherRole=myRole==='founder'?'customer':'founder';
    if(chat.typing===otherRole&&chat.typingExp&&Date.now()<chat.typingExp){
      const typingEl=document.createElement('div');
      typingEl.className='typing-indicator';
      typingEl.innerHTML='<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
      msgsEl.appendChild(typingEl);
    }

    if(atBottom) msgsEl.scrollTop=msgsEl.scrollHeight;
  }

  function sendMsg(){
    const txt=strip(inputEl.value.trim());
    if(!txt)return;
    _lastSentAt=Date.now(); // proteksi polling jangan overwrite 5 detik ke depan
    sendChatMessage(chatId,txt,myRole);
    setTyping(chatId,myRole,false);
    inputEl.value='';
    // Mark as read saat kita kirim pesan (kita aktif di sini)
    const curMsgs=(DB.get('chats')||[]).find(c=>c.id===chatId)?.messages||[];
    if(myRole==='customer') localStorage.setItem('ma_cust_read_'+chatId,String(curMsgs.length));
    else localStorage.setItem('ma_chat_read_'+chatId,String(curMsgs.length));
    renderMsgs();
  }

  sendBtn.addEventListener('click',sendMsg);
  inputEl.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});

  // Typing broadcast
  inputEl.addEventListener('input',()=>{
    clearTimeout(typingTimer);
    setTyping(chatId,myRole,true);
    typingTimer=setTimeout(()=>setTyping(chatId,myRole,false),3500);
  });

  // Poll chat tiap 3 detik — lebih cepat untuk real-time feel
  pollChat=setInterval(async()=>{
    try{
      const res=await fetch(`${JSONBIN_API}/b/${_binId}/latest`,{headers:{'X-Master-Key':JSONBIN_KEY,'X-Bin-Meta':false}});
      if(!res.ok)return;
      const data=await res.json();
      if(Array.isArray(data.chats)){
        const msSinceSent=Date.now()-_lastSentAt;
        const serverChat=data.chats.find(c=>c.id===chatId);
        const localChat=(DB.get('chats')||[]).find(c=>c.id===chatId);
        const sLen=serverChat?.messages?.length||0;
        const lLen=localChat?.messages?.length||0;

        // Jika baru kirim dalam 10 detik DAN lokal punya lebih banyak pesan → skip
        if(msSinceSent<=10000&&lLen>=sLen){
          renderMsgs();
          return;
        }

        // Jika lokal masih lebih banyak (server belum sync) → push ulang dan render lokal
        if(lLen>sLen){
          setTimeout(()=>DB._push(),50);
          renderMsgs();
          return;
        }

        // Merge: gabungkan pesan lokal yang belum ada di server
        if(serverChat&&localChat&&lLen>0){
          const serverIds=new Set((serverChat.messages||[]).map(m=>m.id));
          const localOnly=(localChat.messages||[]).filter(m=>!serverIds.has(m.id));
          if(localOnly.length>0){
            serverChat.messages=[...(serverChat.messages||[]),...localOnly].sort((a,b)=>a.time>b.time?1:-1);
            setTimeout(()=>DB._push(),50);
          }
        }

        // Server lebih update — aman untuk update cache
        _cache.chats=data.chats;
        _localSet('chats',data.chats);
        renderMsgs(data.chats);
        // Mark as read karena chat ini aktif di layar
        const curChat=(data.chats||[]).find(c=>c.id===chatId);
        const curLen=curChat?.messages?.length||0;
        if(myRole==='customer') localStorage.setItem('ma_cust_read_'+chatId,String(curLen));
        else localStorage.setItem('ma_chat_read_'+chatId,String(curLen));
      }
    }catch(e){}
  },3000);

  const wrap=h('div',{style:{display:'flex',flexDirection:'column',height:'460px'}},[
    msgsEl,
    h('div',{style:{padding:'12px 16px',borderTop:'1px solid var(--border)',display:'flex',gap:'8px',alignItems:'center'}},[inputEl,sendBtn]),
  ]);

  renderMsgs();

  return {el:wrap, destroy:()=>{clearInterval(pollChat);clearTimeout(typingTimer);setTyping(chatId,myRole,false);}};
}

  function buildChat(){
    if(chatDestroy){chatDestroy();chatDestroy=null;}
    const orders=DB.get('orders')||[];
    const myOrders=orders.filter(o=>o.userId===user.id||o.userEmail===user.email);
    const acceptedOrders=myOrders.filter(o=>o.status==='done'||o.chatEnabled);

    const wrap=h('div',{},[
      h('h2',{style:{fontSize:'26px',fontWeight:800,marginBottom:'4px',letterSpacing:'-1px'}},'Chat'),
      h('p',{style:{color:'var(--text3)',fontSize:'13px',marginBottom:'20px'}},'Chat per orderan produk'),
    ]);

    if(myOrders.length===0){
      wrap.appendChild(h('div',{class:'card',style:{textAlign:'center',padding:'40px 20px'}},[
        h('div',{style:{fontSize:'40px',marginBottom:'12px'}},'💬'),
        h('p',{style:{color:'var(--text3)',fontSize:'14px'}},'Buat order dulu untuk mulai chat dengan founder.'),
        h('button',{class:'btn-w',style:{marginTop:'16px',padding:'10px 24px'},onClick(){setPage('products');}}, 'Lihat Produk'),
      ]));
      return wrap;
    }

    if(acceptedOrders.length===0){
      wrap.appendChild(h('div',{class:'card',style:{textAlign:'center',padding:'40px 20px',border:'1px solid #2a2a00'}},[
        h('div',{style:{fontSize:'40px',marginBottom:'12px'}},'⏳'),
        h('p',{style:{color:'#888',fontSize:'14px',lineHeight:1.6}},'Chat akan aktif setelah founder menerima ordermu. Sabar ya! 😊'),
      ]));
      return wrap;
    }

    const allChats=DB.get('chats')||[];
    const chatPanel=h('div',{id:'cust-chat-panel'});
    let activeChatDestroy=null;

    function openOrderChat(order){
      if(activeChatDestroy){activeChatDestroy();activeChatDestroy=null;}
      let chat=allChats.find(c=>c.orderId===order.id);
      if(!chat){chat=getOrCreateOrderChat(order);}
      // Mark as read
      const freshChats=DB.get('chats')||[];
      const freshChat=freshChats.find(c=>c.id===chat.id);
      const msgLen=freshChat?.messages?.length||0;
      localStorage.setItem('ma_cust_read_'+chat.id,String(msgLen));
      chatPanel.innerHTML='';
      const header=h('div',{style:{display:'flex',alignItems:'center',gap:'10px',padding:'12px 16px',borderBottom:'1px solid var(--border)',background:'var(--bg3)'}},[
        h('button',{style:{background:'none',border:'none',color:'var(--text3)',fontSize:'20px',lineHeight:1},onClick(){if(activeChatDestroy){activeChatDestroy();activeChatDestroy=null;chatDestroy=null;}chatPanel.innerHTML='';}},'←'),
        h('div',{style:{flex:1}},[
          h('div',{style:{fontWeight:700,fontSize:'14px'}},order.productName),
          h('div',{style:{color:'#25d366',fontSize:'11px',fontWeight:600}},'Chat dengan Founder'),
        ]),
      ]);
      const {el:chatEl,destroy}=buildChatUI(chat.id,'customer');
      activeChatDestroy=destroy;chatDestroy=destroy;
      chatPanel.appendChild(h('div',{style:{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'16px',overflow:'hidden'}},[header,chatEl]));
    }

    // List order yang sudah accepted
    const listEl=h('div',{style:{display:'flex',flexDirection:'column',gap:'10px',marginBottom:'16px'}});
    acceptedOrders.forEach(order=>{
      const chat=allChats.find(c=>c.orderId===order.id);
      let unread=0;
      if(chat){
        const lastRead=parseInt(localStorage.getItem('ma_cust_read_'+chat.id)||'0');
        const msgs=chat.messages||[];
        for(let i=lastRead;i<msgs.length;i++){if(msgs[i].role==='founder')unread++;}
      }
      const lastMsg=chat?.messages?.slice(-1)[0];
      listEl.appendChild(h('div',{style:{background:'var(--bg2)',border:'1px solid '+(unread>0?'#333':'var(--border)'),borderRadius:'14px',padding:'14px 16px',cursor:'pointer',display:'flex',alignItems:'center',gap:'12px'},onClick(){openOrderChat(order);}},[
        h('div',{style:{width:'42px',height:'42px',borderRadius:'10px',background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',flexShrink:0}},'📦'),
        h('div',{style:{flex:1,minWidth:0}},[
          h('div',{style:{fontWeight:700,fontSize:'14px',marginBottom:'2px'}},order.productName),
          h('div',{style:{fontSize:'12px',color:'var(--text3)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},
            lastMsg?(lastMsg.role==='founder'?'Founder: ':'Kamu: ')+lastMsg.text:'Belum ada pesan'),
        ]),
        h('div',{style:{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:'4px',flexShrink:0}},[
          unread>0?h('span',{style:{background:'#25d366',color:'#fff',borderRadius:'10px',minWidth:'20px',height:'20px',fontSize:'10px',fontWeight:900,display:'flex',alignItems:'center',justifyContent:'center',padding:'0 4px'}},String(unread)):h('span',{}),
          h('span',{style:{color:'var(--text3)',fontSize:'12px'}},'→'),
        ]),
      ]));
    });

    // Order pending (belum di-acc)
    const pendingOrders=myOrders.filter(o=>o.status!=='done'&&!o.chatEnabled);
    if(pendingOrders.length>0){
      listEl.appendChild(h('p',{style:{color:'var(--text3)',fontSize:'11px',textTransform:'uppercase',letterSpacing:'1px',marginTop:'12px',marginBottom:'6px'}},'⏳ Menunggu Konfirmasi'));
      pendingOrders.forEach(order=>{
        listEl.appendChild(h('div',{style:{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'14px',padding:'14px 16px',opacity:'0.5',display:'flex',alignItems:'center',gap:'12px'}},[
          h('div',{style:{width:'42px',height:'42px',borderRadius:'10px',background:'var(--bg3)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'20px',flexShrink:0}},'📦'),
          h('div',{style:{flex:1}},[
            h('div',{style:{fontWeight:700,fontSize:'14px',marginBottom:'2px'}},order.productName),
            h('div',{style:{fontSize:'12px',color:'var(--text3)'}},'Menunggu founder menerima order...'),
          ]),
        ]));
      });
    }

    wrap.appendChild(listEl);
    wrap.appendChild(chatPanel);
    return wrap;
  }

        f.appendChild(h('button',{class:'btn-g',style:{width:'100%',padding:'12px',marginTop:'16px',fontSize:'13px'},onClick(){editMode=true;renderAcctFields();}},'Edit Profil'));
      } else {

        const pi=h('input',{type:'tel',placeholder:'No. HP',style:{marginBottom:'10px'}});

          }},'Simpan'),
        ]));

    renderAcctFields();

      const img=document.createElement('img');img.style.cssText='max-width:95vw;max-height:75vh;object-fit:contain;border-radius:10px;';img.src=imgs[cur];

            return wrap2;
          })
        ) : null,
        h('div',{style:{fontWeight:700,fontSize:'15px',marginBottom:'3px'}},t.buyerName||'Customer'),
        h('div',{style:{color:'#25d366',fontSize:'12px',marginBottom:'6px'}},'📦 '+t.productName),

            b.style.cssText='position:absolute;top:-4px;right:-6px;background:#25d366;color:#fff;border-radius:10px;min-width:16px;height:16px;font-size:9px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 3px;';
            b.textContent=totalUnread>99?'99+':String(totalUnread);
            return b;
          })() : h('span',{}),
        ]),
        h('span',{style:{fontSize:'10px',color:'var(--text3)',fontWeight:400}},n.label),
      ]))
    ),
  ]);
  render(screen);
  setPage('home');
  startPolling(user);
}

function renderFounder(){
  // Request notification permission
  if('Notification' in window&&Notification.permission==='default'){
    Notification.requestPermission();
  }

  let tab='dashboard';
  let settings=DB.get('settings')||{};
  let products=DB.get('products')||[];
  let users=DB.get('users')||[];
  let orders=DB.get('orders')||[];
  let appeals=DB.get('appeals')||[];
  let chats=DB.get('chats')||[];
  let editProduct=null;
  let editTestimoni=null; // state form testimoni

  window._founderSetTab=(t)=>setTab(t);

  const tabs=[
    {id:'dashboard',icon:'📊',label:'Dashboard'},
    {id:'products',icon:'📦',label:'Produk'},
    {id:'users',icon:'👥',label:'Users'},
    {id:'orders',icon:'📋',label:'Orders'},
    {id:'chat',icon:'💬',label:'Chat'},
    {id:'appeals',icon:'⚖️',label:'Banding'},
    {id:'testimoni',icon:'⭐',label:'Testimoni'},
    {id:'settings',icon:'⚙️',label:'Pengaturan'},
    {id:'appearance',icon:'🎨',label:'Tampilan'},
    {id:'sitetools',icon:'🛠️',label:'Site Tools'},
  ];

  function refresh(){
    products=DB.get('products')||[];
    users=DB.get('users')||[];
    orders=DB.get('orders')||[];
    appeals=DB.get('appeals')||[];
    chats=DB.get('chats')||[];
    settings=DB.get('settings')||{};
  }

  function setTab(t){
    tab=t;refresh();
    // Cleanup chat poll timer jika pindah dari tab chat
    if(typeof window['ma_prev_chat_cleanup']==='function'&&t!=='chat'){
      window['ma_prev_chat_cleanup']();
      window['ma_prev_chat_cleanup']=null;
    }
    const main=document.getElementById('f-main');
    if(!main)return;
    main.innerHTML='';
    main.appendChild(buildContent());
    tabs.forEach(tb=>{
      const btn=document.getElementById('ftab-'+tb.id);
      if(btn){btn.style.background=tb.id===t?'#111':'none';btn.style.color=tb.id===t?'#fff':'#444';}
    });
    // Clear badge ketika tab dibuka
    if(t==='orders'){
      const curOrders=DB.get('orders')||[];
      localStorage.setItem('ma_founder_orders_seen',String(curOrders.length));
      _setBadge('ftab-orders',0);
    }
    if(t==='chat') _setBadge('ftab-chat',0);
  }

  function buildContent(){
    if(tab==='dashboard') return buildDash();
    if(tab==='products') return buildProducts();
    if(tab==='users') return buildUsers();
    if(tab==='orders') return buildOrders();
    if(tab==='chat') return buildFounderChat();
    if(tab==='appeals') return buildAppeals();
    if(tab==='testimoni') return buildFounderTestimoni();
    if(tab==='settings') return buildSettings();
    if(tab==='appearance') return buildAppearance();
    if(tab==='sitetools') return buildSiteTools();
    return h('div',{},'');
  }

    const revenue=orders.reduce((a,o)=>{const n=parseInt((o.price||'').replace(/\D/g,''))||0;return a+n;},0);
    const pendingOrders=orders.filter(o=>o.status==='pending').length;
    return h('div',{},[
      h('h2',{style:{fontSize:'24px',fontWeight:800,marginBottom:'6px'}},'Dashboard'),
      h('p',{style:{color:'#444',fontSize:'13px',marginBottom:'24px'}},'Selamat datang, Founder 👋'),
      h('div',{style:{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:'14px',marginBottom:'24px'}},
        [{label:'Total User',val:users.length,icon:'👥'},{label:'Total Produk',val:products.length,icon:'📦'},{label:'Total Order',val:orders.length,icon:'📋'},{label:'Banding Pending',val:appeals.filter(a=>a.status==='pending').length,icon:'⚖️'},{label:'Order Pending',val:pendingOrders,icon:'⏳'},{label:'Est. Revenue',val:'Rp '+revenue.toLocaleString('id-ID'),icon:'💰'}].map(s=>
          h('div',{class:'card'},[
            h('div',{style:{fontSize:'20px',marginBottom:'8px'}},s.icon),
            h('div',{style:{color:'#444',fontSize:'11px',marginBottom:'4px'}},s.label),
            h('div',{style:{fontSize:'22px',fontWeight:900,wordBreak:'break-all'}},String(s.val)),
          ])
        )
      ),
      h('div',{class:'card',style:{marginBottom:'16px',border:'1px solid #1a2a1a'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'8px',color:'#44ff44'}},'🔗 Share / Publish Situs'),
        h('p',{style:{color:'#555',fontSize:'12px',marginBottom:'12px',lineHeight:1.6}},'Bagikan link ini ke customer — mereka bisa langsung buka situsmu.'),
        h('div',{style:{background:'#0a0a0a',border:'1px solid #222',borderRadius:'8px',padding:'10px 14px',fontFamily:'monospace',fontSize:'11px',color:'#888',wordBreak:'break-all',marginBottom:'12px',userSelect:'all'}},location.href.split('#')[0]),
        h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}},[
          h('button',{class:'btn-w',style:{padding:'9px 18px',fontSize:'12px'},onClick(){const url=location.href.split('#')[0];navigator.clipboard.writeText(url).then(()=>showToast('Link disalin! 🔗')).catch(()=>{prompt('Salin link ini:',url);});}},'📋 Salin Link'),
          h('button',{style:{background:'#0a0a0a',border:'1px solid #222',color:'#888',borderRadius:'10px',padding:'9px 18px',fontSize:'12px',cursor:'pointer'},onClick(){const url=location.href.split('#')[0];if(navigator.share){navigator.share({title:settings.siteName||'MasAn Development',url});}else{prompt('Salin link ini:',url);}}},'📤 Share'),
        ]),
      ]),
      h('div',{class:'card'},[
        h('h4',{style:{fontWeight:700,marginBottom:'12px',color:'#888'}},'Order Terbaru'),
        ...orders.slice(-5).reverse().map(o=>h('div',{style:{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid #0f0f0f',fontSize:'13px'}},[
          h('span',{style:{color:'#ccc'}},o.userName),h('span',{style:{color:'#555'}},o.productName),h('span',{style:{color:'#888'}},o.price),
        ])),

  function buildProducts(){
    function toBase64(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.onerror=rej;r.readAsDataURL(file);});}

    function prodForm(){

          const del=document.createElement('button');

          del.onclick=()=>{galleryImages.splice(i,1);renderGallery();};
          wrap.appendChild(im);wrap.appendChild(del);galleryWrap.appendChild(wrap);
        });
        if(galleryImages.length===0){const ph=document.createElement('div');ph.style.cssText='color:#333;font-size:12px;';ph.textContent='Belum ada foto';galleryWrap.appendChild(ph);}
      }
      renderGallery();

      const thumbPreview=document.createElement('div');
      thumbPreview.style.cssText='width:72px;height:72px;border-radius:8px;overflow:hidden;border:1px solid #333;margin-top:8px;display:flex;align-items:center;justify-content:center;background:#111;font-size:11px;color:#555;text-align:center;';
      function renderThumbPreview(){thumbPreview.innerHTML='';if(thumbData){const im=document.createElement('img');im.src=thumbData;im.style.cssText='width:100%;height:100%;object-fit:cover;';thumbPreview.appendChild(im);}else{thumbPreview.textContent='📦';}}
      renderThumbPreview();

      const thumbStatus=document.createElement('div');
      thumbStatus.style.cssText='color:#555;font-size:11px;margin-top:4px;';
      thumbStatus.textContent=thumbData?'✅ Foto tersimpan':'';

      const fileStatus=document.createElement('div');
      fileStatus.style.cssText='color:#25d366;font-size:12px;margin-top:6px;';
      fileStatus.textContent=fileName?'File: '+fileName:'Belum ada file';

      const fieldDefs=[{key:'name',label:'Nama Produk'},{key:'category',label:'Kategori'},{key:'price',label:'Harga'},{key:'desc',label:'Deskripsi singkat'},{key:'detail',label:'Detail lengkap'}];
      const formEl=h('div',{style:{background:'#0a0a0a',border:'1px solid #333',borderRadius:'16px',padding:'24px',marginBottom:'20px'}},[
        h('h4',{style:{marginBottom:'16px',fontWeight:700}},isEdit?'Edit Produk':'Tambah Produk'),
        ...fieldDefs.map(f=>{

          return h('div',{class:'form-row'},[h('label',{class:'lbl'},f.label),inp]);
        }),
        // Thumbnail — upload ke imgbb saat pilih
        h('div',{class:'form-row'},[
          h('label',{class:'lbl'},'Thumbnail Utama'),
          h('input',{type:'file',accept:'image/*',style:{background:'none',border:'none',color:'#555',padding:'4px 0'},onChange:async(e)=>{
            const f=e.target.files[0];if(!f)return;
            thumbStatus.textContent='⏳ Mengupload...';thumbStatus.style.color='#888';
            try{
              thumbData=await uploadToImgbb(f);
              renderThumbPreview();
              thumbStatus.textContent='✅ Upload berhasil!';thumbStatus.style.color='#25d366';
            }catch(err){thumbStatus.textContent='❌ Upload gagal: '+err.message;thumbStatus.style.color='#ff4444';}
          }}),
          thumbPreview,
          thumbStatus,
        ]),
        // Gallery foto — upload ke imgbb satu per satu
        h('div',{class:'form-row'},[
          h('label',{class:'lbl'},'Gallery Foto Detail (bisa banyak)'),
          (() => {
            const galStatus=document.createElement('div');
            galStatus.style.cssText='color:#888;font-size:11px;margin-top:4px;';
            const inp=document.createElement('input');
            inp.type='file';inp.accept='image/*';inp.multiple=true;
            inp.style.cssText='background:none;border:none;color:#555;padding:4px 0;';
            inp.addEventListener('change',async(e)=>{
              const files=Array.from(e.target.files);
              galStatus.textContent='⏳ Mengupload '+files.length+' foto...';galStatus.style.color='#888';
              try{
                const urls=await uploadManyToImgbb(files,(cur,total)=>{

                galStatus.textContent='✅ '+files.length+' foto berhasil diupload!';galStatus.style.color='#25d366';

              inp.value='';
            });
            const wrap=document.createElement('div');
            wrap.appendChild(inp);wrap.appendChild(galStatus);wrap.appendChild(galleryWrap);
            return wrap;
          })(),
        ]),
        // File download — upload ke GitHub
        h('div',{class:'form-row'},[
          h('label',{class:'lbl'},'File Download (terkunci sampai order done)'),
          (() => {
            const st=document.createElement('div');
            st.style.cssText='color:#25d366;font-size:12px;margin-top:6px;';
            st.textContent=fileName?'📎 '+fileName:'Belum ada file';
            const inp=document.createElement('input');
            inp.type='file';
            inp.style.cssText='background:none;border:none;color:#555;padding:4px 0;';
            inp.addEventListener('change',async(e)=>{
              const f=e.target.files[0];if(!f)return;
              st.textContent='⏳ Mengupload file ke GitHub...';st.style.color='#888';
              // Pakai tempId jika produk baru (belum punya id)
              const pid=editProduct?.id||('new_'+uid());

          })(),
          h('p',{style:{color:'#333',fontSize:'11px',marginTop:'4px'}},'⚠️ Customer hanya bisa download jika ordernya sudah "done".'),
        ]),
        h('div',{style:{display:'flex',gap:'10px',marginTop:'8px'}},[
          h('button',{class:'btn-g',style:{padding:'10px 20px'},onClick(){editProduct=null;setTab('products');}},'Batal'),
          h('button',{class:'btn-w',style:{padding:'10px 20px'},onClick(){
            const p={};
            fieldDefs.forEach(f=>{p[f.key]=strip(fields[f.key]?.value||'');});

            p.thumb=thumbData;
            p.gallery=galleryImages;
            // fileData sekarang {path, fileName, size} dari GitHub
            if(fileData&&fileData.path){p.fileRef=fileData;p.fileName=fileData.fileName;}
            else if(editProduct?.fileRef){p.fileRef=editProduct.fileRef;p.fileName=editProduct.fileName;}
            else if(editProduct?.fileData){p.fileRef=null;p.fileName=editProduct.fileName;} // migrasi dari base64 lama

            showToast('Menyimpan... ⏳');

            editProduct=null;setTab('products');

    const prods=DB.get('products')||[];
    return h('div',{},[
      h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}},[
        h('h2',{style:{fontSize:'24px',fontWeight:800}},'Produk'),
        h('button',{class:'btn-w',style:{padding:'10px 20px',fontSize:'13px'},onClick(){editProduct={id:'',name:'',price:'',desc:'',detail:'',thumb:'',category:'',gallery:[],fileData:null,fileName:''};setTab('products');}},'+ Tambah'),
      ]),
      editProduct ? prodForm() : h('span',{},''),
      h('div',{style:{display:'flex',flexDirection:'column',gap:'12px'}},
        prods.map(p=>h('div',{style:{background:'#0a0a0a',border:'1px solid #1a1a1a',borderRadius:'14px',padding:'18px',display:'flex',gap:'14px',alignItems:'center'}},[

            h('div',{style:{color:'#444',fontSize:'12px'}},p.category+' · '+p.price),
            h('div',{style:{color:'#333',fontSize:'11px',marginTop:'3px'}},(p.gallery?.length||0)+' foto · '+(p.fileName?'📎 '+p.fileName:'Tidak ada file')),

          h('div',{style:{display:'flex',gap:'8px'}},[
            h('button',{class:'btn-g',style:{padding:'7px 14px',fontSize:'12px'},onClick(){editProduct={...p};setTab('products');}},'Edit'),
            h('button',{class:'btn-red',onClick(){const ps=(DB.get('products')||[]).filter(x=>x.id!==p.id);DB.set('products',ps);showToast('Produk dihapus');setTab('products');}},'Hapus'),
          ]),
        ]))
      ),
    ]);
  }

  function buildOrders(){
    const ord=DB.get('orders')||[];
    const statusColor={pending:'#888',done:'#44ff44',cancelled:'#ff4444'};
    return h('div',{},[
      h('h2',{style:{fontSize:'24px',fontWeight:800,marginBottom:'20px'}},'Semua Order'),
      ord.length===0 ? h('p',{style:{color:'#333'}},'Belum ada order.') :
      h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}},
        [...ord].reverse().map(o=>{
          const statusSel=document.createElement('select');
          ['pending','done','cancelled'].forEach(st=>{
            const opt=document.createElement('option');
            opt.value=st;opt.textContent=st;
            if(o.status===st)opt.selected=true;
            statusSel.appendChild(opt);
          });
          statusSel.style.cssText='background:#111;border:1px solid #222;color:'+statusColor[o.status||'pending']+';padding:4px 8px;border-radius:6px;font-size:11px;width:auto;';
          statusSel.addEventListener('change',e=>{
            const ords=DB.get('orders')||[];
            const idx=ords.findIndex(x=>x.id===o.id);
            if(idx!==-1){
              const prevStatus=ords[idx].status;
              ords[idx].status=e.target.value;
              // Chat aktif dari pertama kali founder terima (pending→done semua bisa chat)
              // chatEnabled = true saat founder set ke done ATAU kapanpun founder mau enable chat manual
              if(e.target.value==='done') ords[idx].chatEnabled=true;
              if(e.target.value==='cancelled') ords[idx].chatEnabled=false;
              statusSel.style.color=statusColor[e.target.value]||'#888';
              DB.set('orders',ords);
              showToast('Status diperbarui: '+e.target.value);
              if(e.target.value==='done'&&prevStatus!=='done'){
                getOrCreateOrderChat(ords[idx]);
                showToast('✅ File download terbuka & Chat aktif untuk '+o.userName);
              }

          return h('div',{class:'card'},[
            h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'8px',alignItems:'center'}},[
              h('span',{style:{fontWeight:700,fontSize:'14px'}},o.productName),
              h('div',{style:{display:'flex',gap:'8px',alignItems:'center'}},[
                h('span',{style:{color:'#fff',fontWeight:800}},o.price),
                statusSel,

            h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}},[
              h('button',{style:{background:'#111',border:'1px solid #222',color:'#888',borderRadius:'8px',padding:'6px 14px',fontSize:'12px'},onClick(){
                window._openOrderChatId=o.id;
                // Jika chat belum ada, buat dulu
                const allC=DB.get('chats')||[];
                if(!allC.find(c=>c.orderId===o.id)){getOrCreateOrderChat(o);}
                setTab('chat');
              }},'💬 Buka Chat Order'),
              // Tombol enable chat manual jika belum enabled
              !o.chatEnabled ? h('button',{style:{background:'#0a1a0a',border:'1px solid #1a3a1a',color:'#44ff44',borderRadius:'8px',padding:'6px 14px',fontSize:'12px'},onClick(){
