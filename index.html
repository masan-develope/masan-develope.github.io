  // Helper: hitung unread per chat (pesan customer berturutan di akhir)
  function countUnread(chat){
    const msgs=chat.messages||[];
    let n=0;
    for(let i=msgs.length-1;i>=0;i--){
      if(msgs[i].role==='customer')n++;
      else break;
    }
    return n;
  }

  // Founder Chat Tab
  function buildFounderChat(){
    const wrap=h('div',{id:'founder-chat-wrap'},[
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'6px'}},[
        h('h2',{style:{fontSize:'24px',fontWeight:800}},'Chat Customer'),
        h('button',{style:{background:'#1a0000',border:'1px solid #330000',color:'#ff4444',borderRadius:'8px',padding:'7px 14px',fontSize:'12px',cursor:'pointer'},onClick(){
          const allC=DB.get('chats')||[];
          if(allC.length===0){showToast('Tidak ada chat.');return;}
          if(!confirm('Hapus SEMUA chat ('+allC.length+' percakapan)?\nTidak bisa dipulihkan!'))return;
          _cache.chats=[];
          _localSet('chats',[]);
          DB._push(); // push segera tanpa debounce
          if(currentChatDestroy){currentChatDestroy();currentChatDestroy=null;}
          currentOpenChatId=null;
          chatPanel.innerHTML='';
          renderList();
          showToast('Semua chat dihapus.');
        }},'🗑️ Hapus Semua'),
      ]),
      h('p',{style:{color:'#444',fontSize:'13px',marginBottom:'20px'}},'Setiap orderan punya chat tersendiri'),
    ]);

    const listEl=h('div',{id:'founder-chat-list',style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'20px'}});
    const chatPanel=h('div',{id:'founder-chat-panel'});

    let currentChatDestroy=null;
    let currentOpenChatId=null;
    let listPollTimer=null;

    function openChat(chat){
      if(currentChatDestroy){currentChatDestroy();currentChatDestroy=null;}
      currentOpenChatId=chat.id;
      chatPanel.innerHTML='';

      // Mark as read
      const readKey='ma_chat_read_'+chat.id;
      const msgs=((DB.get('chats')||[]).find(c=>c.id===chat.id)?.messages)||[];
      localStorage.setItem(readKey, String(msgs.length));

      const header=h('div',{style:{display:'flex',alignItems:'center',gap:'10px',padding:'12px 16px',borderBottom:'1px solid #1a1a1a'}},[
        h('button',{style:{background:'none',border:'none',color:'#444',fontSize:'20px',lineHeight:1},onClick(){chatPanel.innerHTML='';currentOpenChatId=null;renderList();}},'←'),
        h('div',{style:{width:'38px',height:'38px',borderRadius:'50%',background:'#222',border:'1px solid #333',display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:'16px'}},chat.userName?.[0]?.toUpperCase()||'?'),
        h('div',{style:{flex:1}},[
          h('div',{style:{fontWeight:700,fontSize:'14px'}},chat.userName||'Customer'),
          h('div',{style:{color:'#25d366',fontSize:'11px',fontWeight:600}},'📦 '+( chat.productName||'Order')),
          h('div',{style:{color:'#444',fontSize:'10px'}},chat.userEmail||''),
        ]),
        // Tombol hapus chat langsung dari header
        h('button',{style:{background:'#1a0000',border:'1px solid #330000',color:'#ff4444',borderRadius:'8px',padding:'6px 10px',fontSize:'11px'},onClick(){
          if(!confirm('Hapus chat "'+chat.productName+'" dari '+chat.userName+'?'))return;
          const cs=DB.get('chats')||[];
          DB.set('chats',cs.filter(c=>c.id!==chat.id));
          chatPanel.innerHTML='';currentOpenChatId=null;
          if(currentChatDestroy){currentChatDestroy();currentChatDestroy=null;}
          renderList();showToast('Chat dihapus.');
        }},'🗑️'),
      ]);
      const {el:chatEl,destroy}=buildChatUI(chat.id,'founder');
      currentChatDestroy=destroy;
      const container=h('div',{style:{background:'#0a0a0a',border:'1px solid #1a1a1a',borderRadius:'14px',overflow:'hidden'}},[header,chatEl]);
      chatPanel.appendChild(container);
    }

    function getUnreadCount(chat){
      const readKey='ma_chat_read_'+chat.id;
      const lastRead=parseInt(localStorage.getItem(readKey)||'0');
      const msgs=chat.messages||[];
      let n=0;
      for(let i=lastRead;i<msgs.length;i++){if(msgs[i].role==='customer')n++;}
      return n;
    }

    function renderList(){
      const allChats=DB.get('chats')||[];
      listEl.innerHTML='';

      if(allChats.length===0){
        listEl.appendChild(h('div',{class:'card',style:{textAlign:'center',padding:'40px'}},[
          h('div',{style:{fontSize:'40px',marginBottom:'12px'}},'💬'),
          h('p',{style:{color:'#333'}},'Belum ada percakapan. Chat aktif setelah order di-acc (status "done").'),
        ]));
        return;
      }

      // Sort: unread duluan, lalu lastActivity
      const sorted=[...allChats].sort((a,b)=>{
        const ua=getUnreadCount(a), ub=getUnreadCount(b);
        if(ub!==ua) return ub-ua;
        const ta=new Date(a.lastActivity||a.createdAt||0).getTime();
        const tb=new Date(b.lastActivity||b.createdAt||0).getTime();
        return tb-ta;
      });

      sorted.forEach(chat=>{
        const unread=getUnreadCount(chat);
        const lastMsg=chat.messages?.slice(-1)[0];
        const isTyping=chat.typing==='customer'&&chat.typingExp&&Date.now()<chat.typingExp;
        const isOpen=currentOpenChatId===chat.id;

        const avatarColors=['#4285f4','#ea4335','#34a853','#fbbc04','#9c27b0','#ff9800'];
        const col=avatarColors[(chat.userName?.charCodeAt(0)||0)%avatarColors.length];

        const row=document.createElement('div');
        row.style.cssText=`background:${isOpen?'#111':'#0a0a0a'};border:1px solid ${unread>0?'#2a2a2a':'#1a1a1a'};border-radius:12px;padding:14px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s;`;
        row.addEventListener('mouseenter',()=>{if(!isOpen)row.style.background='#0f0f0f';});
        row.addEventListener('mouseleave',()=>{if(!isOpen)row.style.background=isOpen?'#111':'#0a0a0a';});

        // Avatar — inisial nama user
        const av=document.createElement('div');
        av.style.cssText=`width:44px;height:44px;border-radius:50%;background:${col};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#fff;flex-shrink:0;`;
        av.textContent=(chat.userName?.[0]||'?').toUpperCase();
        row.appendChild(av);

        // Info
        const info=document.createElement('div');
        info.style.cssText='flex:1;min-width:0;';

        // Baris atas: nama user
        const nameRow=document.createElement('div');
        nameRow.style.cssText='display:flex;align-items:center;gap:6px;margin-bottom:2px;';
        const nameEl=document.createElement('span');
        nameEl.style.cssText=`font-weight:${unread>0?'800':'600'};font-size:14px;color:${unread>0?'#fff':'#ccc'};`;
        nameEl.textContent=chat.userName||'Customer';
        nameRow.appendChild(nameEl);
        info.appendChild(nameRow);

        // Baris produk
        const prodEl=document.createElement('div');
        prodEl.style.cssText='font-size:11px;color:#25d366;font-weight:600;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
        prodEl.textContent='📦 '+(chat.productName||'Order');
        info.appendChild(prodEl);

        // Preview pesan terakhir
        const previewEl=document.createElement('div');
        previewEl.style.cssText=`font-size:12px;color:${isTyping?'#44ff44':unread>0?'#aaa':'#444'};font-style:${isTyping?'italic':'normal'};overflow:hidden;text-overflow:ellipsis;white-space:nowrap;`;
        if(isTyping){previewEl.innerHTML='<span style="letter-spacing:2px">● ● ●</span> mengetik...';}
        else{const prefix=lastMsg?.role==='founder'?'Kamu: ':'';previewEl.textContent=lastMsg?(prefix+lastMsg.text):'Belum ada pesan';}
        info.appendChild(previewEl);
        row.appendChild(info);

        // Right: waktu + badge
        const right=document.createElement('div');
        right.style.cssText='display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex-shrink:0;';
        const timeEl=document.createElement('div');
        timeEl.style.cssText='color:#333;font-size:10px;';
        const ts=chat.lastActivity||chat.createdAt||'';
        timeEl.textContent=ts.split(',')[0]||ts;
        right.appendChild(timeEl);
        if(unread>0){
          const badge=document.createElement('div');
          badge.style.cssText='background:#25d366;color:#fff;border-radius:50%;min-width:22px;height:22px;font-size:11px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 4px;';
          badge.textContent=unread>99?'99+':String(unread);
          right.appendChild(badge);
        }
        row.appendChild(right);

        row.addEventListener('click',()=>{openChat(chat);renderList();});

        listEl.appendChild(row);
      });

      // Update sidebar badge
      const totalUnread=allChats.reduce((a,c)=>a+getUnreadCount(c),0);
      _setBadge('ftab-chat', totalUnread);
    }

    // Live-refresh list tiap 4 detik
    listPollTimer=setInterval(async()=>{
      try{
        const res=await fetch(`${JSONBIN_API}/b/${_binId}/latest`,{headers:{'X-Master-Key':JSONBIN_KEY,'X-Bin-Meta':false}});
        if(!res.ok)return;
        const data=await res.json();
        if(Array.isArray(data.chats)){_cache.chats=data.chats;_localSet('chats',data.chats);}
        if(!currentOpenChatId) renderList();
        else {
          const allChats=DB.get('chats')||[];
          const totalUnread=allChats.reduce((a,c)=>a+getUnreadCount(c),0);
          _setBadge('ftab-chat', totalUnread);
        }
      }catch(e){}
    },4000);

    // Cleanup listener saat tab diganti — gunakan custom event
    const _cleanupKey='ma_chat_cleanup';
    window[_cleanupKey]=()=>{
      clearInterval(listPollTimer);
      if(currentChatDestroy){currentChatDestroy();currentChatDestroy=null;}
    };
    // Panggil cleanup lama jika ada
    const _prevCleanup=window['ma_prev_chat_cleanup'];
    if(typeof _prevCleanup==='function') _prevCleanup();
    window['ma_prev_chat_cleanup']=window[_cleanupKey];

    renderList();

    // Auto-open jika ada _openOrderChatId saat masuk tab chat
    if(window._openOrderChatId){
      const targetOrder=window._openOrderChatId;
      delete window._openOrderChatId;
      const targetChat=(DB.get('chats')||[]).find(c=>c.orderId===targetOrder);
      if(targetChat){setTimeout(()=>{openChat(targetChat);renderList();},100);}
    }

    wrap.appendChild(listEl);
    wrap.appendChild(chatPanel);

    // Init badge
    const allChats=DB.get('chats')||[];
    const totalUnread=allChats.reduce((a,c)=>a+getUnreadCount(c),0);
    _setBadge('ftab-chat', totalUnread);

    return wrap;
  }

      socialWrap.innerHTML='';
      (cfg.socialLinks||[]).forEach((s,i)=>{
        const iconInp=h('input',{type:'text',style:{width:'50px',textAlign:'center'}});iconInp.value=s.icon;
        const lblInp=h('input',{type:'text',placeholder:'Label'});lblInp.value=s.label;
        const urlInp=h('input',{type:'text',placeholder:'URL'});urlInp.value=s.url;
        iconInp.addEventListener('input',e=>{cfg.socialLinks[i].icon=e.target.value;});
        lblInp.addEventListener('input',e=>{cfg.socialLinks[i].label=e.target.value;});
        urlInp.addEventListener('input',e=>{cfg.socialLinks[i].url=e.target.value;});
        socialWrap.appendChild(h('div',{style:{display:'flex',gap:'8px',marginBottom:'8px',alignItems:'center'}},[
          iconInp,lblInp,urlInp,
          h('button',{style:{background:'none',border:'none',color:'#ff4444',fontSize:'18px',flexShrink:0},onClick(){cfg.socialLinks.splice(i,1);buildSocLinks();}},'✕'),
        ]));
      });
    }

    const wrap=h('div',{},[
      h('h2',{style:{fontSize:'24px',fontWeight:800,marginBottom:'20px'}},'Pengaturan Situs'),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Logo'),
        logoPrev,
        h('label',{class:'lbl'},'Upload Logo'),
        (() => {
          const st=document.createElement('div');st.style.cssText='color:#888;font-size:11px;margin:4px 0;';
          const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
          inp.style.cssText='background:none;border:none;color:#555;padding:4px 0;margin-bottom:8px;';
          inp.addEventListener('change',async(e)=>{
            const file=e.target.files[0];if(!file)return;
            st.textContent='⏳ Mengupload logo...';
            try{cfg.logo=await uploadToImgbb(file);buildLogoPreview();st.textContent='✅ Logo terupload!';}
            catch(err){st.textContent='❌ Gagal: '+err.message;}
          });
          const wrap=document.createElement('div');wrap.appendChild(inp);wrap.appendChild(st);return wrap;
        })(),
        h('label',{class:'lbl',style:{marginTop:'4px'}},'Atau URL Logo'),
        (()=>{const inp=h('input',{type:'text',placeholder:'https://...'});inp.value=cfg.logo&&!cfg.logo.startsWith('data:')?cfg.logo:'';inp.addEventListener('input',e=>{cfg.logo=e.target.value;buildLogoPreview();});return inp;})(),
        h('button',{class:'btn-red',style:{marginTop:'10px',fontSize:'11px'},onClick(){cfg.logo='';buildLogoPreview();}},'Hapus Logo'),
      ]),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'🖼️ Hero Banner (Thumbnail Beranda)'),
        bannerPrev,
        h('p',{style:{color:'#444',fontSize:'12px',marginBottom:'8px'}},'Gambar banner besar yang tampil di halaman beranda di belakang logo/nama'),
        h('label',{class:'lbl'},'Upload Banner'),
        (() => {
          const st=document.createElement('div');st.style.cssText='color:#888;font-size:11px;margin:4px 0;';
          const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
          inp.style.cssText='background:none;border:none;color:#555;padding:4px 0;margin-bottom:8px;';
          inp.addEventListener('change',async(e)=>{
            const file=e.target.files[0];if(!file)return;
            st.textContent='⏳ Mengupload banner...';
            try{cfg.heroBanner=await uploadToImgbb(file);buildBannerPreview();st.textContent='✅ Banner terupload!';}
            catch(err){st.textContent='❌ Gagal: '+err.message;}
          });
          const wrap=document.createElement('div');wrap.appendChild(inp);wrap.appendChild(st);return wrap;
        })(),
        h('label',{class:'lbl',style:{marginTop:'4px'}},'Atau URL Banner'),
        (()=>{const inp=h('input',{type:'text',placeholder:'https://...'});inp.value=cfg.heroBanner&&!cfg.heroBanner.startsWith('data:')?cfg.heroBanner:'';inp.addEventListener('input',e=>{cfg.heroBanner=e.target.value;buildBannerPreview();});return inp;})(),
        h('button',{class:'btn-red',style:{marginTop:'10px',fontSize:'11px'},onClick(){cfg.heroBanner='';buildBannerPreview();}},'Hapus Banner'),
      ]),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Informasi Situs'),
        ...fields.map(f=>{
          const inp=h('input',{type:f.type||'text'});
          inp.value=cfg[f.key]||'';
          inp.addEventListener('input',e=>{cfg[f.key]=e.target.value;});
          inputs[f.key]=inp;
          return h('div',{class:'form-row'},[h('label',{class:'lbl'},f.label),inp]);
        }),
      ]),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'16px'}},[
          h('h4',{style:{fontWeight:700,color:'#888'}},'Sosial Media'),
          h('button',{class:'btn-g',style:{padding:'6px 14px',fontSize:'12px'},onClick(){if(!cfg.socialLinks)cfg.socialLinks=[];cfg.socialLinks.push({label:'',url:'',icon:'🔗'});buildSocLinks();}},'+ Tambah'),
        ]),
        socialWrap,
      ]),

      h('button',{class:'btn-w',style:{padding:'13px 32px',fontSize:'14px'},onClick(){
        ['siteName','tagline','supportEmail','copyright','founderEmail'].forEach(k=>{if(cfg[k])cfg[k]=strip(cfg[k]);});
        if(cfg.socialLinks) cfg.socialLinks=cfg.socialLinks.map(sl=>({icon:strip(sl.icon).slice(0,4),label:strip(sl.label),url:safeUrl(sl.url)}));
        DB.set('settings',cfg);settings=cfg;applyTheme();showToast('Pengaturan disimpan!');
      }},'Simpan Semua Pengaturan'),
    ]);
    buildLogoPreview();buildBannerPreview();buildSocLinks();
    return wrap;
  }

  function buildAppearance(){
    let cfg={...settings};
    const fontOptions=['Inter','Poppins','Space Grotesk','Syne','Geist Mono'];
    const themeOptions=[{val:'dark',label:'🌑 Dark (Default)'},{val:'light',label:'☀️ Light'},{val:'midnight',label:'🌙 Midnight Blue'},{val:'green',label:'💚 Matrix Green'}];
    const fontSel=document.createElement('select');
    fontOptions.forEach(f=>{const o=document.createElement('option');o.value=f;o.textContent=f;if(f===(cfg.font||'Inter'))o.selected=true;fontSel.appendChild(o);});
    fontSel.addEventListener('change',e=>{cfg.font=e.target.value;});
    const themeSel=document.createElement('select');
    themeOptions.forEach(t=>{const o=document.createElement('option');o.value=t.val;o.textContent=t.label;if(t.val===(cfg.theme||'dark'))o.selected=true;themeSel.appendChild(o);});
    themeSel.addEventListener('change',e=>{cfg.theme=e.target.value;});
    const accentInp=document.createElement('input');accentInp.type='color';accentInp.value=cfg.accentColor||'#ffffff';accentInp.style.cssText='width:60px;height:40px;padding:2px;border-radius:8px;border:1px solid #222;background:#111;cursor:pointer;';accentInp.addEventListener('input',e=>{cfg.accentColor=e.target.value;accentText.value=e.target.value;});
    const accentText=document.createElement('input');accentText.type='text';accentText.value=cfg.accentColor||'#ffffff';accentText.style.cssText='width:120px;';accentText.addEventListener('input',e=>{cfg.accentColor=e.target.value;accentInp.value=e.target.value;});
    const radiusInp=document.createElement('input');radiusInp.type='range';radiusInp.min='0';radiusInp.max='24';radiusInp.value=cfg.borderRadius||'10';radiusInp.style.cssText='width:100%;margin:8px 0;';
    const radiusLabel=document.createElement('span');radiusLabel.textContent=(cfg.borderRadius||'10')+'px';radiusLabel.style.color='#888';
    radiusInp.addEventListener('input',e=>{cfg.borderRadius=e.target.value;radiusLabel.textContent=e.target.value+'px';});
    const cssArea=document.createElement('textarea');cssArea.placeholder='/* Custom CSS kamu di sini */';cssArea.value=cfg.customCSS||'';cssArea.style.cssText='min-height:140px;resize:vertical;font-family:monospace;font-size:12px;';cssArea.addEventListener('input',e=>{cfg.customCSS=e.target.value;});

    return h('div',{},[
      h('h2',{style:{fontSize:'24px',fontWeight:800,marginBottom:'6px'}},'Tampilan & Tema'),
      h('p',{style:{color:'#444',fontSize:'13px',marginBottom:'24px'}},'Kustomisasi penampilan situs'),
      h('div',{class:'card',style:{marginBottom:'16px'}},[h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Font'),h('div',{class:'form-row'},[h('label',{class:'lbl'},'Pilih Font'),fontSel])]),
      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Tema Warna'),
        h('div',{class:'form-row'},[h('label',{class:'lbl'},'Pilih Tema'),themeSel]),
        h('div',{class:'form-row'},[h('label',{class:'lbl'},'Warna Aksen'),h('div',{style:{display:'flex',gap:'10px',alignItems:'center'}},[accentInp,accentText])]),
        h('div',{style:{display:'flex',gap:'8px',marginTop:'8px',flexWrap:'wrap'}},
          ['#ffffff','#ff6b6b','#4ecdc4','#ffe66d','#a8e6cf','#ff8b94','#c3a6ff','#f7b733'].map(c=>{const b=document.createElement('button');b.style.cssText=`width:28px;height:28px;border-radius:50%;background:${c};border:2px solid #333;cursor:pointer;`;b.addEventListener('click',()=>{cfg.accentColor=c;accentInp.value=c;accentText.value=c;});return b;})
        ),
      ]),
      h('div',{class:'card',style:{marginBottom:'16px'}},[h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Border Radius'),radiusInp,radiusLabel]),
      h('div',{class:'card',style:{marginBottom:'16px'}},[h('h4',{style:{fontWeight:700,marginBottom:'12px',color:'#888'}},'Custom CSS'),cssArea]),
      h('div',{style:{display:'flex',gap:'10px'}},[
        h('button',{class:'btn-w',style:{padding:'13px 32px',fontSize:'14px'},onClick(){
          Object.assign(cfg,{font:fontSel.value,theme:themeSel.value,accentColor:accentInp.value,borderRadius:radiusInp.value,customCSS:cssArea.value});
          const full={...DB.get('settings')||{},...cfg};
          DB.set('settings',full);settings=full;applyTheme();showToast('Tampilan disimpan!');
        }},'Simpan & Preview'),
        h('button',{class:'btn-g',style:{padding:'13px 24px',fontSize:'14px'},onClick(){
          if(!confirm('Reset tampilan ke default?'))return;
          const full={...DB.get('settings')||{},font:'Inter',theme:'dark',accentColor:'#ffffff',borderRadius:'10',customCSS:''};
          DB.set('settings',full);settings=full;applyTheme();showToast('Reset ke default');setTab('appearance');
        }},'Reset Default'),
      ]),
    ]);
  }

  function buildSiteTools(){
    let cfg={...settings};
    const maintToggle=document.createElement('input');maintToggle.type='checkbox';maintToggle.checked=!!cfg.maintenanceMode;maintToggle.style.cssText='width:auto;transform:scale(1.4);cursor:pointer;margin-right:8px;';
    const maintMsg=document.createElement('input');maintMsg.type='text';maintMsg.value=cfg.maintenanceMsg||'Sedang dalam maintenance. Silakan coba lagi nanti.';
    const annToggle=document.createElement('input');annToggle.type='checkbox';annToggle.checked=!!cfg.announcementBarOn;annToggle.style.cssText='width:auto;transform:scale(1.4);cursor:pointer;margin-right:8px;';
    const annMsg=document.createElement('input');annMsg.type='text';annMsg.placeholder='Contoh: 🎉 Promo akhir tahun! Diskon 20% semua produk';annMsg.value=cfg.announcementBar||'';

    function exportData(){
      const data={users:DB.get('users'),products:DB.get('products'),orders:DB.get('orders'),appeals:DB.get('appeals'),chats:DB.get('chats'),settings:DB.get('settings')};
      const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a');a.href=url;a.download='masandev-backup-'+Date.now()+'.json';a.click();
      URL.revokeObjectURL(url);showToast('Backup didownload!');
    }
    function importData(){
      const inp=document.createElement('input');inp.type='file';inp.accept='.json';
      inp.addEventListener('change',e=>{
        const file=e.target.files[0];if(!file)return;
        const reader=new FileReader();
        reader.onload=ev=>{
          try{
            const data=JSON.parse(ev.target.result);
            if(data.users)DB.set('users',data.users);
            if(data.products)DB.set('products',data.products);
            if(data.orders)DB.set('orders',data.orders);
            if(data.appeals)DB.set('appeals',data.appeals);
            if(data.chats)DB.set('chats',data.chats);
            if(data.settings)DB.set('settings',data.settings);
            showToast('Data berhasil di-import!');applyTheme();setTab('sitetools');
          }catch(err){showToast('File tidak valid!','err');}
        };
        reader.readAsText(file);
      });
      inp.click();
    }

    return h('div',{},[
      h('h2',{style:{fontSize:'24px',fontWeight:800,marginBottom:'6px'}},'Site Tools'),
      h('p',{style:{color:'#444',fontSize:'13px',marginBottom:'24px'}},'Tools manajemen lanjutan'),

      // GitHub Token — disimpan di JSONBin bukan di kode
      h('div',{class:'card',style:{marginBottom:'16px',border:'1px solid #1a2a1a'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'8px',color:'#44ff44'}},'🔑 GitHub Token (File Download)'),
        h('p',{style:{color:'#444',fontSize:'12px',marginBottom:'12px',lineHeight:1.6}},'Token ini disimpan di database, bukan di source code. Aman dari scan GitHub.\nGenerate di: github.com → Settings → Developer settings → Personal access tokens → centang repo'),
        (() => {
          const inp=document.createElement('input');
          inp.type='password';
          inp.placeholder='ghp_xxxxxxxxxxxx';
          inp.value=settings.githubToken||'';
          inp.style.cssText='width:100%;background:#0a0a0a;border:1px solid #333;color:#fff;padding:10px 14px;border-radius:10px;font-size:13px;font-family:monospace;';
          const st=document.createElement('div');
          st.style.cssText='color:#555;font-size:11px;margin-top:6px;';
          st.textContent=settings.githubToken?'✅ Token tersimpan':'Belum ada token';
          const saveBtn=document.createElement('button');
          saveBtn.textContent='Simpan Token';
          saveBtn.style.cssText='margin-top:10px;background:#44ff44;border:none;color:#000;padding:8px 18px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;';
          saveBtn.onclick=()=>{
            const val=inp.value.trim();
            if(!val){showToast('Token tidak boleh kosong','err');return;}
            const full={...DB.get('settings')||{},githubToken:val};
            DB.set('settings',full);settings=full;
            st.textContent='✅ Token tersimpan!';st.style.color='#25d366';
            showToast('GitHub token disimpan! ✅');
          };
          const wrap=document.createElement('div');
          wrap.appendChild(inp);wrap.appendChild(st);wrap.appendChild(saveBtn);
          return wrap;
        })(),
      ]),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Maintenance Mode'),
        h('div',{style:{display:'flex',alignItems:'center',marginBottom:'12px'}},[maintToggle,h('span',{style:{fontSize:'14px',fontWeight:600}},'Aktifkan Maintenance Mode')]),
        h('p',{style:{color:'#444',fontSize:'12px',marginBottom:'10px'}},'Saat aktif, user biasa tidak bisa akses. Founder masuk via ketuk logo 5x.'),
        h('div',{class:'form-row'},[h('label',{class:'lbl'},'Pesan Maintenance'),maintMsg]),
      ]),
      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Announcement Bar'),
        h('div',{style:{display:'flex',alignItems:'center',marginBottom:'12px'}},[annToggle,h('span',{style:{fontSize:'14px',fontWeight:600}},'Tampilkan Announcement Bar')]),
        h('div',{class:'form-row'},[h('label',{class:'lbl'},'Pesan Announcement'),annMsg]),
      ]),
      h('button',{class:'btn-w',style:{padding:'12px 28px',fontSize:'14px',marginBottom:'24px'},onClick(){
        const full={...DB.get('settings')||{},maintenanceMode:maintToggle.checked,maintenanceMsg:strip(maintMsg.value).slice(0,300),announcementBarOn:annToggle.checked,announcementBar:strip(annMsg.value).slice(0,200)};
        DB.set('settings',full);settings=full;applyTheme();showToast('Site tools disimpan!');
      }},'Simpan Site Tools'),

      // Notifikasi
      h('div',{class:'card',style:{marginBottom:'16px',border:'1px solid #1a2a1a'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'12px',color:'#44ff44'}},'🔔 Notifikasi Push'),
        h('p',{style:{color:'#444',fontSize:'12px',marginBottom:'12px'}},'Aktifkan notifikasi browser agar dapat pemberitahuan order & chat baru secara real-time.'),
        h('button',{class:'btn-w',style:{padding:'10px 20px',fontSize:'13px'},onClick(){
          if('Notification' in window){
            Notification.requestPermission().then(p=>{
              if(p==='granted'){showToast('✅ Notifikasi diaktifkan!');}
              else{showToast('Notifikasi ditolak. Aktifkan di pengaturan browser.','err');}
            });
          } else {showToast('Browser tidak mendukung notifikasi.','err');}
        }},'Aktifkan Notifikasi Browser'),
      ]),

      h('div',{class:'card',style:{marginBottom:'16px'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'16px',color:'#888'}},'Backup & Restore'),
        h('p',{style:{color:'#444',fontSize:'12px',marginBottom:'16px'}},'Export semua data (users, produk, orders, chats, settings) ke file JSON, atau restore dari backup.'),
        h('div',{style:{display:'flex',gap:'10px',flexWrap:'wrap'}},[
          h('button',{class:'btn-w',style:{padding:'10px 22px',fontSize:'13px'},onClick:exportData},'⬇️ Export Backup'),
          h('button',{class:'btn-g',style:{padding:'10px 22px',fontSize:'13px'},onClick:importData},'⬆️ Import Backup'),
        ]),
      ]),
      h('div',{class:'card',style:{border:'1px solid #330000'}},[
        h('h4',{style:{fontWeight:700,marginBottom:'12px',color:'#ff4444'}},'⚠️ Danger Zone'),
        h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}},[
          h('button',{class:'btn-red',style:{textAlign:'left',padding:'10px 16px'},onClick(){if(!confirm('Hapus semua order?'))return;DB.set('orders',[]);showToast('Semua order dihapus');setTab('sitetools');}},'Hapus Semua Order'),
          h('button',{class:'btn-red',style:{textAlign:'left',padding:'10px 16px'},onClick(){if(!confirm('Reset semua user?'))return;DB.set('users',[]);showToast('Semua user dihapus');setTab('sitetools');}},'Hapus Semua User'),
          h('button',{style:{background:'#1a0000',border:'1px solid #660000',color:'#ff2222',borderRadius:'8px',padding:'10px 16px',fontSize:'12px',textAlign:'left'},onClick(){
            if(!confirm('RESET TOTAL? Semua data terhapus!'))return;
            if(!confirm('Yakin 100%? Ini TIDAK bisa dibatalkan!'))return;
            const s2=DB.get('settings')||{};const fe=s2.founderEmail;const fp=s2.founderPass;
            localStorage.clear();DB.init();
            const ns=DB.get('settings')||{};ns.founderEmail=fe;ns.founderPass=fp;DB.set('settings',ns);
            DB.set('session',{email:fe,name:'Founder',role:'founder',id:'founder'});
            showToast('Factory reset selesai');renderFounder();
          }},'🔥 Factory Reset (Hapus Semua Data)'),
        ]),
      ]),
    ]);
  }

  // Layout
  const sidebar=h('div',{style:{width:'200px',background:'#050505',borderRight:'1px solid #111',display:'flex',flexDirection:'column',position:'fixed',top:0,left:0,bottom:0,zIndex:50}},[
    h('div',{style:{padding:'20px 16px',borderBottom:'1px solid #111'}},[
      h('div',{style:{fontWeight:900,fontSize:'13px',color:'#fff'}},'MA Founder'),
      h('div',{style:{fontSize:'10px',color:'#333',marginTop:'2px'}},'Panel Admin'),
    ]),
    h('div',{style:{flex:1,padding:'10px',overflowY:'auto'}},
      tabs.map(t=>h('button',{id:'ftab-'+t.id,style:{width:'100%',background:'none',border:'none',color:'#444',padding:'10px 12px',borderRadius:'8px',cursor:'pointer',textAlign:'left',display:'flex',gap:'10px',alignItems:'center',fontSize:'13px',marginBottom:'2px'},onClick(){setTab(t.id);}},[h('span',{},t.icon),t.label]))
    ),
    h('button',{style:{margin:'10px',background:'none',border:'1px solid #1a1a1a',color:'#333',padding:'10px',borderRadius:'8px',fontSize:'12px'},onClick(){stopPolling();DB.set('session',null);renderAuth();}},'Logout'),
  ]);

  const screen=h('div',{style:{minHeight:'100vh',background:'#000',color:'#fff',display:'flex'}},[
    sidebar,
    h('div',{id:'f-main',style:{marginLeft:'200px',flex:1,padding:'28px',maxWidth:'calc(100vw - 200px)',minHeight:'100vh'}}),
  ]);

  render(screen);
  setTab('dashboard');
  startPolling({role:'founder',id:'founder'});

  // Inisialisasi badge langsung dari data saat ini
  setTimeout(()=>{
    const data={orders:DB.get('orders')||[],chats:DB.get('chats')||[]};
    updateFounderBadges(data);
  },300);
}

// ════════════════════════════════════════
// BOOT
// ════════════════════════════════════════
(async function boot(){
  document.getElementById('app').innerHTML='<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;"><div class="spinner"></div><p style="color:#333;font-size:12px;">Menghubungkan ke server...</p></div>';
  try{await Promise.race([DB.init(),new Promise((_,rej)=>setTimeout(()=>rej('timeout'),6000))]);}catch(e){console.warn('DB init gagal/timeout, pakai cache lokal:',e);}

  const s=DB.get('settings')||{};
  applyTheme();
  document.title=s.siteName||'MasAn Development';

  const sess=DB.get('session');
  if(!sess){renderAuth();}
  else if(sess.role==='founder'){renderFounder();initFCM(sess);}
  else if(sess.blocked){renderBlocked(sess);}
  else{
    renderCustomer(sess);
    initFCM(sess);
    const hash=location.hash.replace('#','').trim();
    if(hash&&['home','products','social','chat','account'].includes(hash)){
      setTimeout(()=>{const btn=document.getElementById('nav-'+hash);if(btn)btn.click();},50);
    }
  }
})();
</script>
